name: HBI PIT Raw Source Evidence Pilot

on:
  pull_request:
    paths:
      - "src/hbi/source_capture.py"
      - "tests/test_source_capture.py"
      - ".github/workflows/hbi-pit-evidence-pilot.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: "pre captures upcoming program/history; post captures official results"
        required: true
        type: choice
        options: [pre, post]
        default: pre

permissions:
  contents: read

concurrency:
  group: hbi-pit-raw-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    # No secrets, no GitHub writes, no checkout of external forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local package and pytest
        run: pip install -e ".[dev]"
      - name: Source capture unit tests
        run: pytest -q tests/test_source_capture.py
      - name: Capture immutable HTTP representation bodies (research only)
        env:
          HBI_PIT_CAPTURE_PATH: pit-capture
          HBI_PIT_CAPTURE_STAGE: ${{ github.event.inputs.stage || 'pre' }}
        run: python -m hbi.source_capture
      - name: Upload bounded raw-source archive and hash manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hbi-pit-evidence-${{ github.run_id }}
          path: pit-capture/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
