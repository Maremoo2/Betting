name: DATA-004 Original 7-Archive 24-PDF E2E (read only)

on:
  pull_request:
    paths:
      - 'src/hbi/data004_archive_replay.py'
      - 'tests/test_data004_archive_replay.py'
      - '.github/workflows/data004-original-archive-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-pdf-replay:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -e '.[dev]'
      - name: Negative archive tests use synthetic fixtures only
        run: python -m pytest -q tests/test_data004_archive_replay.py
      - name: Fetch seven ORIGINAL Collector GitHub Actions artifact ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for artifact in 12135567920 12152059609 12210589268 12211357452 12218163952 12219187865 12219320854; do
            gh api "repos/Maremoo2/rikstoto-program-collector/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/$artifact.zip"
            test -s "$RUNNER_TEMP/$artifact.zip"
          done
      - name: Recheck 24 actual original PDF byte hashes and produce blank gold tasks
        shell: bash
        run: |
          set -euo pipefail
          python -m hbi.data004_archive_replay \
            --manifest research/data004-holdout-prereg-v1.json \
            --source-evidence research/data004-holdout-source-pdf-evidence-v1.json \
            --archive "12135567920=$RUNNER_TEMP/12135567920.zip" \
            --archive "12152059609=$RUNNER_TEMP/12152059609.zip" \
            --archive "12210589268=$RUNNER_TEMP/12210589268.zip" \
            --archive "12211357452=$RUNNER_TEMP/12211357452.zip" \
            --archive "12218163952=$RUNNER_TEMP/12218163952.zip" \
            --archive "12219187865=$RUNNER_TEMP/12219187865.zip" \
            --archive "12219320854=$RUNNER_TEMP/12219320854.zip" \
            --blank-ledger-output "$RUNNER_TEMP/data004-blank-review.csv" \
            --report-output "$RUNNER_TEMP/data004-original-archive-report.json"
      - name: Original source integrity does not certify human gold, PIT or BET
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          report = json.loads((root / "data004-original-archive-report.json").read_text())
          with (root / "data004-blank-review.csv").open(newline="") as stream:
              rows = list(csv.DictReader(stream))
          assert report["status"] == "ORIGINAL_24_PDFS_BYTE_VERIFIED_GOLD_PENDING"
          assert report["verified_original_pdf_programs"] == 24
          assert report["archive_count"] == 7
          assert report["locked_sample_rows"] == 30
          assert report["original_holdout_cells"] == 390
          assert len(rows) == 390
          assert {r["gold_status"] for r in rows} == {"PENDING_VISUAL_REVIEW"}
          assert all(not r["gold_value"] for r in rows)
          assert report["source_byte_checks_performed_in_this_run"] is True
          assert report["source_row_identity_independently_accepted"] is False
          assert report["gold_fields_independently_verified"] is False
          assert report["holdout_validated"] is False
          assert report["pit_certified"] is False
          assert report["model_training_or_bet_authority"] is False
          print("DATA004_24_ORIGINAL_PDFS_VERIFIED__ZERO_GOLD_OR_BET_AUTHORITY")
          PY
      - name: Upload source report and blank human review sheet only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data004-24-original-pdf-source-audit
          path: |
            ${{ runner.temp }}/data004-original-archive-report.json
            ${{ runner.temp }}/data004-blank-review.csv
          if-no-files-found: warn
          retention-days: 30
