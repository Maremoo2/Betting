name: HBI Provider Live Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/live-fundamental-ingestion-v2"

permissions:
  contents: read

concurrency:
  group: hbi-provider-live-smoke
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install HBI
        run: pip install -e ".[dev]"

      - name: Run live read-only provider smoke
        env:
          HBI_LIVE_SMOKE_PATH: live-smoke.json
        run: python -m hbi.live_smoke

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hbi-provider-live-smoke-${{ github.run_id }}
          path: live-smoke.json
          if-no-files-found: ignore
          retention-days: 14
