name: HBI Rikstoto Live Smoke

on:
  push:
    branches: ["test/rikstoto-live-smoke"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install HBI
        run: pip install -e ".[dev]"

      - name: Run live read-only Rikstoto smoke
        env:
          HBI_LIVE_SMOKE_PATH: live-smoke.json
        run: python -m hbi.live_smoke

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rikstoto-live-smoke-${{ github.run_id }}
          path: live-smoke.json
          if-no-files-found: ignore
          retention-days: 7
