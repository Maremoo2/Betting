name: CORE-003 Isolated Source Coverage Pilot

on:
  # Pilot only: source acquisition in a dedicated SQLite artifact. Never writes hbi-state.
  schedule:
    - cron: "*/15 7-21 * * *"
  # One bootstrap run on MAIN when this pilot workflow itself changes.
  # Unrelated code pushes do not trigger extra provider calls.
  push:
    branches: [main]
    paths:
      - ".github/workflows/core-003-shadow-pilot.yml"
  workflow_dispatch:
    inputs:
      execute:
        description: "Fetch live research sources (false = read-only preview)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: core003-isolated-source-pilot
  cancel-in-progress: false

jobs:
  source-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install HBI
        run: pip install -e ".[dev]"

      - name: Gate Oslo hours and select pilot mode
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_EXECUTE: ${{ inputs.execute }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from hbi.schedule import evaluate_schedule
          if os.environ["EVENT_NAME"] in {"schedule", "push"}:
              decision = evaluate_schedule()
              print(f"run={'true' if decision.should_run else 'false'}")
              print("execute=true")
              print(f"reason={decision.reason}")
          else:
              print("run=true")
              print(f"execute={'true' if os.environ.get('MANUAL_EXECUTE') == 'true' else 'false'}")
              print("reason=manual")
          PY

      - name: Restore only the isolated pilot artifact
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from hbi.state_artifact import restore_latest_state
          found = restore_latest_state(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GITHUB_TOKEN"],
              target_path="data/core003-pilot.sqlite",
              artifact_name="core003-pilot-state",
              branch="main",
          )
          print("PILOT_STATE_RESTORE=" + ("RESTORED" if found else "FRESH"))
          PY

      - name: Initialize isolated research database
        if: steps.gate.outputs.run == 'true'
        run: hbi --db data/core003-pilot.sqlite init-db

      - name: Execute research source capture (no model, no bets)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true'
        run: |
          python -m hbi.core_shadow_pilot \
            --db data/core003-pilot.sqlite \
            --out core003-pilot-report.json \
            --horizon-minutes 90 \
            --max-tasks 4 \
            --market-window-minutes 30 \
            --execute

      - name: Preview without provider calls
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute != 'true'
        run: |
          python -m hbi.core_shadow_pilot \
            --db data/core003-pilot.sqlite \
            --out core003-pilot-report.json \
            --horizon-minutes 90 \
            --max-tasks 4 \
            --market-window-minutes 30

      - name: Freeze a read-only Champion and CORE-004 research report
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && success()
        shell: bash
        run: |
          # Reuse the exact fixed CORE-003 cohort; never discover a different race.
          # No source/production DB writes, betting, or model/threshold changes.
          python - <<'PY'
          import json
          import sqlite3
          import subprocess
          import sys
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          evidence = Path('core003-pilot-report.json')
          db_path = Path('data/core003-pilot.sqlite')
          if not evidence.is_file() or not db_path.is_file():
              raise SystemExit('BET_MVP_MISSING_CORE003_INPUT')
          source = json.loads(evidence.read_text(encoding='utf-8'))
          cohort = source.get('races_in_fixed_cohort', [])
          readiness = source.get('race_readiness_after', [])
          if (not isinstance(cohort, list) or
                  any(not isinstance(race_id, str) for race_id in cohort) or
                  len(cohort) != len(set(cohort)) or
                  not isinstance(readiness, list) or
                  any(not isinstance(item, dict) or
                      not isinstance(item.get('race_id'), str)
                      for item in readiness)):
              raise SystemExit('BET_MVP_INVALID_CORE003_COHORT')
          by_race = {row['race_id']: row for row in readiness}
          if len(by_race) != len(readiness) or set(by_race) != set(cohort):
              raise SystemExit('BET_MVP_CORE003_FIXED_COHORT_AUDIT_MISMATCH')
          cutoff = datetime.now(UTC)
          selected = []
          skipped = []
          con = sqlite3.connect(f'file:{db_path.resolve()}?mode=ro', uri=True)
          try:
              for race_id in cohort:
                  row = con.execute('SELECT start_time_utc FROM races WHERE race_id=?',
                                    (race_id,)).fetchone()
                  if row is None:
                      raise SystemExit('BET_MVP_CORE003_COHORT_RACE_MISSING')
                  start = datetime.fromisoformat(str(row[0]))
                  if start.utcoffset() is None:
                      raise SystemExit('BET_MVP_RACE_START_CLOCK_INVALID')
                  start = start.astimezone(UTC)
                  earliest = by_race[race_id].get('earliest_retained_source_start_utc')
                  if earliest:
                      source_start = datetime.fromisoformat(str(earliest))
                      if source_start.utcoffset() is None:
                          raise SystemExit('BET_MVP_SOURCE_START_CLOCK_INVALID')
                      start = min(start, source_start.astimezone(UTC))
                  if cutoff + timedelta(minutes=4) < start:
                      selected.append((
                          not by_race[race_id].get('history_complete_as_of_t4', False),
                          start, race_id,
                      ))
                  else:
                      skipped.append({'race_id': race_id, 'status': 'TOO_LATE_FOR_PROSPECTIVE_SHADOW'})
          finally:
              con.close()

          # Preserve the ENTIRE pre-existing CORE-003 cohort. Run the unchanged
          # Champion + CORE-004 CLI for every still-prospective race, including
          # source-blocked races. Order source-ready races first, not odds leaders.
          root = Path('bet-mvp-shadow')
          root.mkdir(parents=True, exist_ok=False)
          reports = []
          errors = []
          for _, _, race_id in sorted(selected):
              if not race_id.startswith('RIKSTOTO:') or '/' in race_id or '\\' in race_id:
                  raise SystemExit('BET_MVP_INVALID_FIXED_RACE_ID')
              target = root / race_id.replace(':', '_')
              process = subprocess.run([
                  sys.executable, '-m', 'hbi.bet_mvp_shadow',
                  '--db', str(db_path), '--source-report', str(evidence),
                  '--race-id', race_id, '--as-of', cutoff.isoformat(),
                  '--run-kind', 'PROSPECTIVE_ATTEMPT', '--out', str(target),
              ], check=False)
              if process.returncode != 0:
                  errors.append(race_id)
                  reports.append({'race_id': race_id, 'status': 'MODEL_INVOCATION_FAILED'})
                  continue
              shadow = json.loads((target / 'shadow.json').read_text(encoding='utf-8'))
              reports.append({
                  'race_id': race_id,
                  'status': 'REPORT_FROZEN',
                  'model_status': shadow['model_status'],
                  'market_status': shadow['market_status'],
                  'pit_status': shadow['pit_status'],
                  'bet_authority': shadow['bet_authority'],
                  'report_path': str(target / 'shadow.json'),
              })
          index = {
              'schema': 'BET_MVP_FIXED_CORE003_COHORT_INDEX_V1',
              'source_report': str(evidence),
              'as_of_utc': cutoff.isoformat(),
              'cohort_races': cohort,
              'reports': reports,
              'skipped': skipped,
              'bet_authority': False,
              'pit_certified': False,
          }
          (root / 'index.json').write_text(
              json.dumps(index, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(index, ensure_ascii=False))
          if errors:
              raise SystemExit('BET_MVP_FIXED_COHORT_MODEL_FAILURES: ' + ','.join(errors))
          PY

      - name: Upload frozen model research report (not a bet)
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: bet-mvp-shadow-${{ github.run_id }}
          path: bet-mvp-shadow/
          if-no-files-found: ignore
          retention-days: 21

      - name: Persist isolated research state for next pilot
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: core003-pilot-state
          path: data/core003-pilot.sqlite
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Upload per-run source coverage report
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: core003-pilot-report-${{ github.run_id }}
          path: core003-pilot-report.json
          if-no-files-found: warn
          retention-days: 21
