name: CORE-003 Isolated Source Coverage Pilot

on:
  # Pilot only: source acquisition in a dedicated SQLite artifact. Never writes hbi-state.
  schedule:
    - cron: "*/5 7-21 * * *"
  # One bootstrap run on MAIN when this pilot workflow itself changes.
  # Unrelated code pushes do not trigger extra provider calls.
  push:
    branches: [main]
    paths:
      - ".github/workflows/core-003-shadow-pilot.yml"
  workflow_dispatch:
    inputs:
      execute:
        description: "Fetch live research sources (false = read-only preview)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: core003-isolated-source-pilot
  cancel-in-progress: false

jobs:
  source-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install HBI
        run: pip install -e ".[dev]"

      - name: Gate Oslo hours and select pilot mode
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_EXECUTE: ${{ inputs.execute }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from hbi.schedule import evaluate_schedule
          if os.environ["EVENT_NAME"] in {"schedule", "push"}:
              decision = evaluate_schedule()
              print(f"run={'true' if decision.should_run else 'false'}")
              print("execute=true")
              print(f"reason={decision.reason}")
          else:
              print("run=true")
              print(f"execute={'true' if os.environ.get('MANUAL_EXECUTE') == 'true' else 'false'}")
              print("reason=manual")
          PY

      - name: Restore only the isolated pilot artifact
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from hbi.state_artifact import restore_latest_state
          found = restore_latest_state(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GITHUB_TOKEN"],
              target_path="data/core003-pilot.sqlite",
              artifact_name="core003-pilot-state",
              branch="main",
          )
          print("PILOT_STATE_RESTORE=" + ("RESTORED" if found else "FRESH"))
          PY

      - name: Initialize isolated research database
        if: steps.gate.outputs.run == 'true'
        run: hbi --db data/core003-pilot.sqlite init-db

      # PIT-003A is a source-only sidecar, never a replacement for CORE-003.
      # GitHub cron is best-effort. Late jobs explicitly record MISSED_T4.
      - name: Capture race-relative original T-4 receipts (research only)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true'
        run: |
          python -m hbi.core_t4_receipt capture \
            --db data/core003-pilot.sqlite --out pit003a-source-receipts

      - name: Execute research source capture (no model, no bets)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true'
        run: |
          python -m hbi.core_shadow_pilot \
            --db data/core003-pilot.sqlite \
            --out core003-pilot-report.json \
            --horizon-minutes 90 \
            --max-tasks 4 \
            --market-window-minutes 30 \
            --execute

      - name: Preview without provider calls
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute != 'true'
        run: |
          python -m hbi.core_shadow_pilot \
            --db data/core003-pilot.sqlite \
            --out core003-pilot-report.json \
            --horizon-minutes 90 \
            --max-tasks 4 \
            --market-window-minutes 30

      - name: Freeze read-only Champion and CORE-004 reports for fixed cohort
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && success()
        shell: bash
        run: |
          # Assess each member of CORE-003's unchanged original cohort.
          # No provider calls, outcome selection, threshold changes, or betting.
          python - <<'PY'
          import json
          import sqlite3
          import subprocess
          import sys
          from datetime import UTC, datetime
          from pathlib import Path

          from hbi.bet_mvp_shadow import select_fixed_cohort_races, sha256

          source_path = Path('core003-pilot-report.json')
          db_path = Path('data/core003-pilot.sqlite')
          if not source_path.is_file() or not db_path.is_file():
              raise SystemExit('BET_MVP_MISSING_CORE003_INPUT')
          source_report = json.loads(source_path.read_text(encoding='utf-8'))
          if not isinstance(source_report, dict):
              raise SystemExit('BET_MVP_INVALID_CORE003_REPORT')
          as_of = datetime.now(UTC)
          connection = sqlite3.connect(f'file:{db_path.resolve()}?mode=ro', uri=True)
          connection.row_factory = sqlite3.Row
          try:
              selection = select_fixed_cohort_races(connection, source_report, as_of)
          finally:
              connection.close()

          folder = Path('bet-mvp-shadow')
          folder.mkdir(exist_ok=False)
          index = {
              'schema': 'BET_MVP_002_FIXED_COHORT_INDEX_V1',
              'authority': 'RESEARCH_ONLY_NO_BET',
              'run_kind': 'PROSPECTIVE_ATTEMPT',
              'as_of_utc': as_of.isoformat(),
              'source_report_sha256': sha256(source_path),
              'source_database_sha256': sha256(db_path),
              'original_cohort': selection['original_cohort'],
              'eligible_prestart': selection['eligible'],
              'not_processed': selection['not_processed'],
              'processed': [],
              'errors': [],
              'bet_authority': False,
              'pit_certified': False,
          }
          # This runs the unchanged genuine model entrypoints for EVERY
          # eligible pre-start race, even if its source or market will block.
          for number, entry in enumerate(selection['eligible'], start=1):
              race_id = entry['race_id']
              destination = folder / f'race-{number:03d}'
              command = [
                  sys.executable, '-m', 'hbi.bet_mvp_shadow',
                  '--db', str(db_path), '--source-report', str(source_path),
                  '--race-id', race_id, '--as-of', as_of.isoformat(),
                  '--run-kind', 'PROSPECTIVE_ATTEMPT', '--out', str(destination),
              ]
              run = subprocess.run(command, capture_output=True, text=True, check=False)
              if run.returncode != 0 or not (destination / 'shadow.json').is_file():
                  index['errors'].append({
                      'race_id': race_id,
                      'reason': 'MODEL_REPORT_EXECUTION_ERROR',
                      'exit_code': run.returncode,
                      'stderr': run.stderr[-1500:],
                  })
                  continue
              report = json.loads((destination / 'shadow.json').read_text(encoding='utf-8'))
              index['processed'].append({
                  'race_id': race_id,
                  'directory': str(destination),
                  'analysis_status': report['analysis_status'],
                  'model_status': report['model_status'],
                  'market_status': report['market_status'],
                  'pit_status': report['pit_status'],
                  'model_blockers': report['model_blockers'],
                  'market_blockers': report['market_blockers'],
                  'active_runners': report['active_runners'],
                  'champion_p_sum': report['champion_p_sum'],
                  'core004_p_sum': report['core004_p_sum'],
                  'model_calculated_at_utc': report['model_calculated_at_utc'],
                  'report_created_at_utc': report['report_created_at_utc'],
                  'report_sha256': sha256(destination / 'shadow.json'),
                  'bet_authority': False,
              })
          index['index_written_at_utc'] = datetime.now(UTC).isoformat()
          (folder / 'cohort-index.json').write_text(
              json.dumps(index, indent=2, ensure_ascii=False, allow_nan=False) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'cohort': len(selection['original_cohort']),
              'prestart_eligible': len(selection['eligible']),
              'processed': len(index['processed']),
              'model_ready': sum(r['model_status'] == 'MODEL_READY' for r in index['processed']),
              'not_processed': len(index['not_processed']),
              'errors': len(index['errors']),
              'bet_authority': False,
          }, ensure_ascii=False))
          if index['errors']:
              raise SystemExit('BET_MVP_FIXED_COHORT_INCOMPLETE_REPORTS')
          PY

      # Prior frozen reports are downloaded by original run ID, never recomputed.
      # Any missing artifact remains an explicit model-link blocker.
      - name: Recover prior original prospective models (read only)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pit003a-prior-models
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > "$RUNNER_TEMP/pit003a-artifacts.json"; then
            echo "PRIOR_FROZEN_ARTIFACT_LIST_UNAVAILABLE"
          else
            python - <<'PY' > "$RUNNER_TEMP/pit003a-prior.tsv"
          import json
          import os
          from pathlib import Path

          items = json.loads((Path(os.environ["RUNNER_TEMP"]) / "pit003a-artifacts.json").read_text())
          filtered = [
              item for item in items.get("artifacts", [])
              if str(item.get("name", "")).startswith("bet-mvp-shadow-")
              and item.get("expired") is False
              and item.get("workflow_run", {}).get("head_branch") == "main"
              and item.get("workflow_run", {}).get("id") != int(os.environ["GITHUB_RUN_ID"])
          ]
          filtered.sort(key=lambda item: (item.get("created_at", ""), item.get("id", 0)), reverse=True)
          for item in filtered[:20]:
              print(str(item["workflow_run"]["id"]) + " " + item["name"])
          PY
            while read -r prior_run artifact_name; do
              test -n "$prior_run" || continue
              mkdir -p "pit003a-prior-models/$prior_run"
              gh run download "$prior_run" --repo "$GITHUB_REPOSITORY" \
                --name "$artifact_name" --dir "pit003a-prior-models/$prior_run" \
                || echo "PRIOR_FROZEN_REPORT_DOWNLOAD_BLOCKED:$prior_run"
            done < "$RUNNER_TEMP/pit003a-prior.tsv"
          fi

      # Authenticate the separate Collector run, then replay its original
      # PDF and raw starts bytes. Failure is a PIT blocker, never a pass.
      - name: Recover authenticated Collector originals (read only)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f pit003a-source-receipts/index.json ]; then
            echo "T4_RECEIPTS_NOT_AVAILABLE"; exit 0
          fi
          mkdir -p pit003a-collector-archive
          if ! gh run list --repo Maremoo2/rikstoto-program-collector \
              --workflow rikstoto-morning.yml --limit 15 \
              --json databaseId,createdAt,event,conclusion,workflowName \
              > "$RUNNER_TEMP/pit003a-collector-runs.json"; then
            echo "COLLECTOR_RUN_LIST_UNAVAILABLE"; exit 0
          fi
          python - <<'PY' > "$RUNNER_TEMP/pit003a-collector-selected.txt"
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          index = json.loads(Path("pit003a-source-receipts/index.json").read_text())
          dates = {
              entry["race_id"].split(":")[1][-10:]
              for entry in index["records"] if entry["race_id"].startswith("RIKSTOTO:")
          }
          runs = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                             "pit003a-collector-runs.json").read_text())
          matches = [
              run for run in runs
              if run.get("event") == "schedule"
              and run.get("conclusion") == "success"
              and run.get("workflowName") == "Daily Rikstoto full programs – 07 Oslo"
              and datetime.fromisoformat(run["createdAt"].replace("Z", "+00:00"))
                  .astimezone(ZoneInfo("Europe/Oslo")).date().isoformat() in dates
          ]
          matches.sort(key=lambda run: run["createdAt"], reverse=True)
          if len(matches) == 1:
              print(matches[0]["databaseId"])
          PY
          selected="$(cat "$RUNNER_TEMP/pit003a-collector-selected.txt")"
          if [ -z "$selected" ]; then echo "COLLECTOR_ORIGINAL_NOT_UNAMBIGUOUS"; exit 0; fi
          if ! gh run download "$selected" --repo Maremoo2/rikstoto-program-collector \
               --name rikstoto-morning-programs --dir pit003a-collector-archive; then
            echo "COLLECTOR_ARCHIVE_DOWNLOAD_UNAVAILABLE"; exit 0
          fi
          if ! gh run view "$selected" --repo Maremoo2/rikstoto-program-collector \
              --json databaseId,createdAt,event,conclusion,workflowName,headSha \
              > "$RUNNER_TEMP/pit003a-collector-run.json"; then
            echo "COLLECTOR_GITHUB_PROVENANCE_UNAVAILABLE"; exit 0
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          info = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                            "pit003a-collector-run.json").read_text())
          document = {
              "source_repository": "Maremoo2/rikstoto-program-collector",
              "github_run_id": info["databaseId"],
              "created_at_utc": info["createdAt"],
              "event": info["event"],
              "conclusion": info["conclusion"],
              "workflow_name": info["workflowName"],
              "head_sha": info["headSha"],
              "obtained_via_authenticated_gh_cli": True,
          }
          Path("pit003a-collector-archive/provenance.json").write_text(
              json.dumps(document, sort_keys=True, indent=2) + "\n"
          )
          PY

      - name: Independently audit T-4 source receipts against frozen reports
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && always()
        run: |
          if [ -f pit003a-source-receipts/index.json ]; then
            python -m hbi.core_t4_receipt attest \
              --receipts pit003a-source-receipts \
              --model-reports bet-mvp-shadow \
              --prior-model-reports pit003a-prior-models \
              --collector-root pit003a-collector-archive \
              --collector-provenance pit003a-collector-archive/provenance.json \
              --out pit003a-attestations
          fi

      - name: Upload restored immutable prior model evidence
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pit003a-prior-frozen-models-${{ github.run_id }}
          path: pit003a-prior-models/
          if-no-files-found: ignore
          retention-days: 21

      - name: Upload Collector original provenance used for PIT verification
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pit003a-collector-evidence-${{ github.run_id }}
          path: pit003a-collector-archive/
          if-no-files-found: ignore
          retention-days: 21

      - name: Upload original T-4 source receipts
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pit003a-source-receipts-${{ github.run_id }}
          path: pit003a-source-receipts/
          if-no-files-found: ignore
          retention-days: 21

      - name: Upload PIT T-4 research attestations (NO BET)
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pit003a-attestations-${{ github.run_id }}
          path: pit003a-attestations/
          if-no-files-found: ignore
          retention-days: 21

      - name: Upload frozen model research report (not a bet)
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: bet-mvp-shadow-${{ github.run_id }}
          path: bet-mvp-shadow/
          if-no-files-found: ignore
          retention-days: 21

      - name: Persist isolated research state for next pilot
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: core003-pilot-state
          path: data/core003-pilot.sqlite
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Upload per-run source coverage report
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: core003-pilot-report-${{ github.run_id }}
          path: core003-pilot-report.json
          if-no-files-found: warn
          retention-days: 21
