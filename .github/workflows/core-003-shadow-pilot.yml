name: CORE-003 Isolated Source Coverage Pilot

on:
  # Pilot only: source acquisition in a dedicated SQLite artifact. Never writes hbi-state.
  schedule:
    - cron: "*/5 7-21 * * *"
  # One bootstrap run on MAIN when this pilot workflow itself changes.
  # Unrelated code pushes do not trigger extra provider calls.
  push:
    branches: [main]
    paths:
      - ".github/workflows/core-003-shadow-pilot.yml"
  workflow_dispatch:
    inputs:
      execute:
        description: "Fetch live research sources (false = read-only preview)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: core003-isolated-source-pilot
  cancel-in-progress: false

jobs:
  source-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install HBI
        run: pip install -e ".[dev]"

      - name: Gate Oslo hours and select pilot mode
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_EXECUTE: ${{ inputs.execute }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from hbi.schedule import evaluate_schedule
          if os.environ["EVENT_NAME"] in {"schedule", "push"}:
              decision = evaluate_schedule()
              print(f"run={'true' if decision.should_run else 'false'}")
              print("execute=true")
              print(f"reason={decision.reason}")
          else:
              print("run=true")
              print(f"execute={'true' if os.environ.get('MANUAL_EXECUTE') == 'true' else 'false'}")
              print("reason=manual")
          PY

      - name: Restore only the isolated pilot artifact
        id: restore
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from hbi.state_artifact import restore_latest_state
          found = restore_latest_state(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GITHUB_TOKEN"],
              target_path="data/core003-pilot.sqlite",
              artifact_name="core003-pilot-state",
              branch="main",
              required=True,
          )
          print("PILOT_STATE_RESTORE=RESTORED")
          PY

      - name: Initialize isolated research database
        if: steps.gate.outputs.run == 'true'
        run: hbi --db data/core003-pilot.sqlite init-db

      - name: Execute research source capture (no model, no bets)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true'
        run: |
          python -m hbi.core_shadow_pilot \
            --db data/core003-pilot.sqlite \
            --out core003-pilot-report.json \
            --horizon-minutes 90 \
            --max-tasks 4 \
            --market-window-minutes 30 \
            --execute

      - name: Preview without provider calls
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute != 'true'
        run: |
          python -m hbi.core_shadow_pilot \
            --db data/core003-pilot.sqlite \
            --out core003-pilot-report.json \
            --horizon-minutes 90 \
            --max-tasks 4 \
            --market-window-minutes 30

      # Authenticate the separate Collector run, then replay its original
      # PDF and raw starts bytes. Failure is a PIT blocker, never a pass.
      - name: Recover authenticated Collector originals (read only)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && steps.restore.outcome == 'success' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f core003-pilot-report.json ]; then
            echo "CORE003_SOURCE_REPORT_NOT_AVAILABLE"; exit 0
          fi
          mkdir -p pit003a-collector-archive
          if ! gh run list --repo Maremoo2/rikstoto-program-collector \
              --workflow rikstoto-morning.yml --limit 15 \
              --json databaseId,createdAt,event,conclusion,workflowName \
              > "$RUNNER_TEMP/pit003a-collector-runs.json"; then
            echo "COLLECTOR_RUN_LIST_UNAVAILABLE"; exit 0
          fi
          python - <<'PY' > "$RUNNER_TEMP/pit003a-collector-selected.txt"
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          source = json.loads(Path("core003-pilot-report.json").read_text())
          dates = {
              rid.split(":")[1][-10:]
              for rid in source.get("races_in_fixed_cohort", [])
              if isinstance(rid, str) and rid.startswith("RIKSTOTO:")
          }
          runs = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                             "pit003a-collector-runs.json").read_text())
          matches = [
              run for run in runs
              if run.get("event") == "schedule"
              and run.get("conclusion") == "success"
              and run.get("workflowName") == "Daily Rikstoto full programs – 07 Oslo"
              and datetime.fromisoformat(run["createdAt"].replace("Z", "+00:00"))
                  .astimezone(ZoneInfo("Europe/Oslo")).date().isoformat() in dates
          ]
          matches.sort(key=lambda run: run["createdAt"], reverse=True)
          if len(matches) == 1:
              print(matches[0]["databaseId"])
          PY
          selected="$(cat "$RUNNER_TEMP/pit003a-collector-selected.txt")"
          if [ -z "$selected" ]; then echo "COLLECTOR_ORIGINAL_NOT_UNAMBIGUOUS"; exit 0; fi
          if ! gh run download "$selected" --repo Maremoo2/rikstoto-program-collector \
               --name rikstoto-morning-programs --dir pit003a-collector-archive; then
            echo "COLLECTOR_ARCHIVE_DOWNLOAD_UNAVAILABLE"; exit 0
          fi
          if ! gh run view "$selected" --repo Maremoo2/rikstoto-program-collector \
              --json databaseId,createdAt,event,conclusion,workflowName,headSha \
              > "$RUNNER_TEMP/pit003a-collector-run.json"; then
            echo "COLLECTOR_GITHUB_PROVENANCE_UNAVAILABLE"; exit 0
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          info = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                            "pit003a-collector-run.json").read_text())
          document = {
              "source_repository": "Maremoo2/rikstoto-program-collector",
              "github_run_id": info["databaseId"],
              "created_at_utc": info["createdAt"],
              "event": info["event"],
              "conclusion": info["conclusion"],
              "workflow_name": info["workflowName"],
              "head_sha": info["headSha"],
              "obtained_via_authenticated_gh_cli": True,
          }
          Path("pit003a-collector-archive/provenance.json").write_text(
              json.dumps(document, sort_keys=True, indent=2) + "\n"
          )
          PY


      # Import verified immutable Collector program as the canonical roster
      # provenance BEFORE model scoring. TMP, stale or conflicting identities
      # stay blocked even when CORE-003's own ATG research data are complete.
      - name: Validate and import Collector originals into isolated model inputs
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true'
        run: |
          python -m hbi.collector_handoff \
            --db data/core003-pilot.sqlite \
            --collector-root pit003a-collector-archive \
            --collector-provenance pit003a-collector-archive/provenance.json \
            --source-report core003-pilot-report.json \
            --out collector-handoff.json

      - name: Freeze read-only Champion and CORE-004 reports for fixed cohort
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && success()
        shell: bash
        run: |
          # Assess each member of CORE-003's unchanged original cohort.
          # No provider calls, outcome selection, threshold changes, or betting.
          python - <<'PY'
          import json
          import sqlite3
          import subprocess
          import sys
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          from hbi.bet_mvp_shadow import aware, select_fixed_cohort_races, sha256
          from hbi.collector_handoff import write_research_model_report

          source_path = Path('core003-pilot-report.json')
          db_path = Path('data/core003-pilot.sqlite')
          if not source_path.is_file() or not db_path.is_file():
              raise SystemExit('BET_MVP_MISSING_CORE003_INPUT')
          source_report = json.loads(source_path.read_text(encoding='utf-8'))
          if not isinstance(source_report, dict):
              raise SystemExit('BET_MVP_INVALID_CORE003_REPORT')
          as_of = datetime.now(UTC)
          connection = sqlite3.connect(f'file:{db_path.resolve()}?mode=ro', uri=True)
          connection.row_factory = sqlite3.Row
          try:
              selection = select_fixed_cohort_races(connection, source_report, as_of)
          finally:
              connection.close()

          # Fail closed: no model invocation without source-verified Collector
          # roster imported into the original isolated SQLite database.
          handoff_path = Path('collector-handoff.json')
          handoff = json.loads(handoff_path.read_text(encoding='utf-8')) if handoff_path.is_file() else {}
          handoff_rows = handoff.get('records', [])
          if not isinstance(handoff_rows, list):
              handoff_rows = []
          handoff_by_id = {r['race_id']: r for r in handoff_rows if isinstance(r, dict) and isinstance(r.get('race_id'), str)}
          collector_eligible = []
          for entry in selection['eligible']:
              original = handoff_by_id.get(entry['race_id'])
              if not original or original.get('research_model_eligible') is not True:
                  selection['not_processed'].append({
                      'race_id': entry['race_id'], 'reason': 'COLLECTOR_RESEARCH_MODEL_GATE_NOT_VERIFIED',
                      'collector_blockers': original.get('blockers', []) if original else ['NO_COLLECTOR_IMPORT_RECEIPT'],
                  })
              else:
                  collector_eligible.append(entry)
          selection['eligible'] = collector_eligible
          collector_handoff_sha256 = sha256(handoff_path) if handoff_path.is_file() else None

          folder = Path('bet-mvp-shadow')
          folder.mkdir(exist_ok=False)
          index = {
              'schema': 'BET_MVP_002_FIXED_COHORT_INDEX_V1',
              'authority': 'RESEARCH_ONLY_NO_BET',
              'run_kind': 'PROSPECTIVE_ATTEMPT',
              'as_of_utc': as_of.isoformat(),
              'source_report_sha256': sha256(source_path),
              'source_database_sha256': sha256(db_path),
              'collector_handoff_sha256': collector_handoff_sha256,
              'collector_handoff': handoff_rows,
              'original_cohort': selection['original_cohort'],
              'eligible_prestart': selection['eligible'],
              'not_processed': selection['not_processed'],
              'processed': [],
              'errors': [],
              'bet_authority': False,
              'pit_certified': False,
          }
          # This runs the unchanged genuine model entrypoints for EVERY
          # eligible pre-start race, even if its source or market will block.
          for number, entry in enumerate(selection['eligible'], start=1):
              race_id = entry['race_id']
              destination = folder / f'race-{number:03d}'
              cutoff = aware(entry['earliest_source_start_utc']) - timedelta(minutes=4)
              started_at = datetime.now(UTC)
              if started_at >= cutoff:
                  index['not_processed'].append({
                      **entry, 'reason': 'NOT_BEFORE_CONSERVATIVE_T4',
                      'checked_at_utc': started_at.isoformat(), 'cutoff_at_utc': cutoff.isoformat(),
                  })
                  continue
              command = [
                  sys.executable, '-m', 'hbi.bet_mvp_shadow',
                  '--db', str(db_path), '--source-report', str(source_path),
                  '--race-id', race_id, '--as-of', as_of.isoformat(),
                  '--run-kind', 'PROSPECTIVE_ATTEMPT', '--out', str(destination),
              ]
              run = subprocess.run(command, capture_output=True, text=True, check=False)
              if run.returncode != 0 or not (destination / 'shadow.json').is_file():
                  index['errors'].append({
                      'race_id': race_id,
                      'reason': 'MODEL_REPORT_EXECUTION_ERROR',
                      'exit_code': run.returncode,
                      'stderr': run.stderr[-1500:],
                  })
                  continue
              report = json.loads((destination / 'shadow.json').read_text(encoding='utf-8'))
              if aware(report['report_created_at_utc']) >= cutoff:
                  index['errors'].append({
                      **entry, 'reason': 'MODEL_FREEZE_AT_OR_AFTER_T4',
                      'cutoff_at_utc': cutoff.isoformat(),
                      'report_created_at_utc': report['report_created_at_utc'],
                  })
                  # Retain only the timing diagnostic. No late probability file is published.
                  for artifact in destination.iterdir():
                      artifact.unlink()
                  destination.rmdir()
                  continue
              original = handoff_by_id[race_id]
              link_path = destination / 'collector-research-report.json'
              research_link_sha = None
              if (report.get('model_status') == 'MODEL_READY'
                      and report.get('analysis_status') == 'RESEARCH_READY'):
                  connection = sqlite3.connect(f'file:{db_path.resolve()}?mode=ro', uri=True)
                  connection.row_factory = sqlite3.Row
                  try:
                      write_research_model_report(
                          connection, handoff=original,
                          shadow_path=destination / 'shadow.json',
                          source_db=db_path, source_report=source_path,
                          destination=link_path,
                      )
                  except (ValueError, KeyError, TypeError, OSError, sqlite3.Error) as exc:
                      index['errors'].append({
                          'race_id': race_id, 'reason': 'RESEARCH_SOURCE_MODEL_LINK_FAILED',
                          'error_type': type(exc).__name__, 'error': str(exc),
                      })
                      continue
                  finally:
                      connection.close()
                  research_link_sha = sha256(link_path)
              index['processed'].append({
                  'race_id': race_id,
                  'directory': str(destination),
                  'analysis_status': report['analysis_status'],
                  'model_status': report['model_status'],
                  'market_status': report['market_status'],
                  'pit_status': report['pit_status'],
                  'model_blockers': report['model_blockers'],
                  'market_blockers': report['market_blockers'],
                  'active_runners': report['active_runners'],
                  'champion_p_sum': report['champion_p_sum'],
                  'core004_p_sum': report['core004_p_sum'],
                  'model_calculated_at_utc': report['model_calculated_at_utc'],
                  'report_created_at_utc': report['report_created_at_utc'],
                  'report_sha256': sha256(destination / 'shadow.json'),
                  'research_only_model_eligible': original['research_model_eligible'],
                  'research_identity_match': original['research_identity_match'],
                  'independent_identity_attested': False,
                  'model_input_approved': False,
                  'source_original_import_id': original['import_payload_id'],
                  'collector_research_report_sha256': research_link_sha,
                  'bet_authority': False,
              })
          index['index_written_at_utc'] = datetime.now(UTC).isoformat()
          (folder / 'cohort-index.json').write_text(
              json.dumps(index, indent=2, ensure_ascii=False, allow_nan=False) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'cohort': len(selection['original_cohort']),
              'prestart_eligible': len(selection['eligible']),
              'processed': len(index['processed']),
              'model_ready': sum(r['model_status'] == 'MODEL_READY' for r in index['processed']),
              'not_processed': len(index['not_processed']),
              'errors': len(index['errors']),
              'bet_authority': False,
          }, ensure_ascii=False))
          if index['errors']:
              raise SystemExit('BET_MVP_FIXED_COHORT_INCOMPLETE_REPORTS')
          PY

      # Publish the prospective evidence before waiting for receipts or replaying
      # historical outcomes. A later sidecar timeout must not erase a freeze.
      - name: Upload per-run source coverage report
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: core003-pilot-report-${{ github.run_id }}
          path: core003-pilot-report.json
          if-no-files-found: warn
          retention-days: 21

      - name: Upload Collector-to-Betting import and model admission evidence
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-handoff-${{ github.run_id }}
          path: collector-handoff.json
          if-no-files-found: warn
          retention-days: 21

      - name: Upload Collector original provenance used for PIT verification
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pit003a-collector-evidence-${{ github.run_id }}
          path: pit003a-collector-archive/
          if-no-files-found: ignore
          retention-days: 21

      - name: Upload frozen model research report (not a bet)
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: bet-mvp-shadow-${{ github.run_id }}
          path: bet-mvp-shadow/
          if-no-files-found: ignore
          retention-days: 21

      - name: Persist isolated research state for next pilot
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: core003-pilot-state
          path: data/core003-pilot.sqlite
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      # PIT-003A is a source-only sidecar, never a replacement for CORE-003.
      # GitHub cron is best-effort. Late jobs explicitly record MISSED_T4.
      - name: Capture race-relative original T-4 receipts (research only)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true'
        run: |
          python -m hbi.core_t4_receipt capture \
            --db data/core003-pilot.sqlite --out pit003a-source-receipts

      # Offline sidecar: reuse already-frozen reports and exact SQLite physical race
      # catalog. No provider reads, model retraining, bets or schedule changes.
      - name: Analyze all upcoming physical races (WIN anti-favourite dutching NO BET)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && steps.restore.outcome == 'success' && success()
        continue-on-error: true
        run: |
          python scripts/full_race_intelligence_core003_readonly.py \
            --db data/core003-pilot.sqlite \
            --models bet-mvp-shadow \
            --output full-race-intelligence-core003.json

      - name: Upload all-races research-only source status
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: full-race-intelligence-core003-${{ github.run_id }}
          path: full-race-intelligence-core003.json
          if-no-files-found: warn
          retention-days: 14

      # Prior frozen reports are downloaded by original run ID, never recomputed.
      # Any missing artifact remains an explicit model-link blocker.
      - name: Recover prior original prospective models (read only)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && steps.restore.outcome == 'success' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pit003a-prior-models
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > "$RUNNER_TEMP/pit003a-artifacts.json"; then
            echo "PRIOR_FROZEN_ARTIFACT_LIST_UNAVAILABLE"
          else
            python - <<'PY' > "$RUNNER_TEMP/pit003a-prior.tsv"
          import json
          import os
          from pathlib import Path

          items = json.loads((Path(os.environ["RUNNER_TEMP"]) / "pit003a-artifacts.json").read_text())
          filtered = [
              item for item in items.get("artifacts", [])
              if str(item.get("name", "")).startswith("bet-mvp-shadow-")
              and item.get("expired") is False
              and item.get("workflow_run", {}).get("head_branch") == "main"
              and item.get("workflow_run", {}).get("id") != int(os.environ["GITHUB_RUN_ID"])
          ]
          filtered.sort(key=lambda item: (item.get("created_at", ""), item.get("id", 0)), reverse=True)
          for item in filtered[:20]:
              print(str(item["workflow_run"]["id"]) + " " + item["name"])
          PY
            while read -r prior_run artifact_name; do
              test -n "$prior_run" || continue
              mkdir -p "pit003a-prior-models/$prior_run"
              gh run download "$prior_run" --repo "$GITHUB_REPOSITORY" \
                --name "$artifact_name" --dir "pit003a-prior-models/$prior_run" \
                || echo "PRIOR_FROZEN_REPORT_DOWNLOAD_BLOCKED:$prior_run"
            done < "$RUNNER_TEMP/pit003a-prior.tsv"
          fi

      - name: Independently audit T-4 source receipts against frozen reports
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && steps.restore.outcome == 'success' && always()
        run: |
          if [ -f pit003a-source-receipts/index.json ]; then
            python -m hbi.core_t4_receipt attest \
              --receipts pit003a-source-receipts \
              --model-reports bet-mvp-shadow \
              --prior-model-reports pit003a-prior-models \
              --collector-root pit003a-collector-archive \
              --collector-provenance pit003a-collector-archive/provenance.json \
              --out pit003a-attestations
          fi

      # Emit separate, immutable read-only V3.3 gate diagnostics AFTER attestation.
      # Missing originals and unmatched receipts are recorded as BLOCKED, never PASS.
      - name: Generate MVP-009 read-only decision diagnostics
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && steps.restore.outcome == 'success' && always()
        run: |
          python -m hbi.mvp009_auto_decision_audit \
            --cohort-index bet-mvp-shadow/cohort-index.json \
            --attestation-index pit003a-attestations/index.json \
            --output-dir mvp009-decision-audits

      # DEV-011 is strictly separate from PIT-003A's original prior-model recovery.
      # Paginate EVERY existing GitHub artifact page. No latest-N truncation and
      # no model/market/outcome-quality filter. All unavailable originals are
      # explicit blocking entries in an immutable cumulative coverage manifest.
      - name: Recover cumulative DEV-011 originals for scorecard only (NO BET)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && steps.restore.outcome == 'success' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dev011-scorecard-models dev011-scorecard-results dev011-coverage
          # A fully paginated index may still have rate-limited original downloads.
          : > dev011-coverage/download-failures.tsv
          # GitHub artifact total_count may change while paginating. Retry
          # the ENTIRE source inventory from page one. Never accept mixed pages
          # or weaken DEV-011's strict count/duplicate validation.
          inventory_ready=false
          for attempt in 1 2 3; do
            rm -f "$RUNNER_TEMP/dev011-artifact-pages.json" \
              "$RUNNER_TEMP/dev011-downloads.tsv" dev011-coverage/manifest.json
            if gh api --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
                > "$RUNNER_TEMP/dev011-artifact-pages.json" && \
               python -m hbi.dev011_coverage plan \
                 --pages "$RUNNER_TEMP/dev011-artifact-pages.json" \
                 --current-run-id "$GITHUB_RUN_ID" \
                 --manifest dev011-coverage/manifest.json \
                 --downloads-tsv "$RUNNER_TEMP/dev011-downloads.tsv"; then
              inventory_ready=true
              break
            fi
            echo "::warning::DEV011_INVENTORY_RETRY_FULL_PAGINATION:$attempt"
          done
          if [ "$inventory_ready" = true ]; then
            while IFS="$(printf '\t')" read -r prior_run artifact_name kind; do
              test -n "$prior_run" || continue
              if [ "$kind" = model ]; then
                dest="dev011-scorecard-models/$prior_run"
              else
                dest="dev011-scorecard-results/$prior_run"
              fi
              mkdir -p "$dest"
              if ! gh run download "$prior_run" --repo "$GITHUB_REPOSITORY" \
                  --name "$artifact_name" --dir "$dest"; then
                echo "DEV011_ORIGINAL_ARCHIVE_DOWNLOAD_BLOCKED:$artifact_name"
                printf '%s\t%s\t%s\n' "$prior_run" "$artifact_name" "$kind" \
                  >> dev011-coverage/download-failures.tsv
                # One missing original is already a hard blocker. Stop further
                # per-artifact GETs instead of amplifying an installation 403.
                break
              fi
            done < "$RUNNER_TEMP/dev011-downloads.tsv"
            python -m hbi.dev011_coverage finalize \
              --manifest dev011-coverage/manifest.json \
              --models-root dev011-scorecard-models \
              --results-root dev011-scorecard-results
          else
            echo DEV011_PAGINATED_GITHUB_INVENTORY_UNAVAILABLE
            python - <<'PY'
          import json
          from pathlib import Path
          Path("dev011-coverage/manifest.json").write_text(json.dumps({
              "schema": "DEV011_CUMULATIVE_COVERAGE_MANIFEST_V1",
              "authority": "READ_ONLY_RESEARCH", "bet_authority": False,
              "coverage_complete": False, "status": "INCOMPLETE_ORIGINAL_COVERAGE",
              "missing_originals": [{"reason": "PAGINATED_GITHUB_INVENTORY_UNAVAILABLE"}],
              "selected_artifacts": [],
          }, indent=2) + "\n")
          PY
          fi

      # Only historical frozen archives already recovered above. Post-race
      # public GETs are kept in this separate research-only artifact; never
      # feed them into CORE-004, T-4 attestations or betting decisions.
      - name: Generate DEV-009 prospective official outcome scorecard (NO BET)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && steps.restore.outcome == 'success' && always()
        run: |
          # A failed source-inventory attempt is NOT a new zero-race benchmark.
          # Instead emit an explicit, distinct source-unavailable research
          # diagnostic. Keep the independent CORE-003/PIT state untouched.
          if python -m hbi.mvp016_inventory_guard \
              --manifest dev011-coverage/manifest.json \
              --failed-downloads-tsv dev011-coverage/download-failures.tsv \
              --output-dir dev009-outcome-scorecards; then
            python -m hbi.prospective_outcome_scorecard \
              --models-root dev011-scorecard-models \
              --attestation-index pit003a-attestations/index.json \
              --output-dir dev009-outcome-scorecards \
              --prior-results-root dev011-scorecard-results \
              --coverage-manifest dev011-coverage/manifest.json \
              --fetch-official
          else
            echo "::error::DEV009_CUMULATIVE_SCORECARD_SKIPPED_SOURCE_UNAVAILABLE"
          fi

      - name: Export research ledger from current and archived originals (NO BET)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && steps.restore.outcome == 'success' && always()
        id: ledger_export
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dev009-outcome-scorecards research-ledger
          args=()
          if [ -f dev009-outcome-scorecards/index.json ]; then
            args+=(--index-sha "$(sha256sum dev009-outcome-scorecards/index.json | cut -d' ' -f1)")
          fi
          python -m hbi.research_ledger \
            --originals dev011-scorecard-models \
            --scorecard dev009-outcome-scorecards "${args[@]}" \
            --source-report core003-pilot-report.json \
            --current-cohort bet-mvp-shadow \
            --collector-handoff collector-handoff.json \
            --output research-ledger/index.json

      - name: Record research ledger export status (NO BET)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && always()
        env:
          EXPORT_OUTCOME: ${{ steps.ledger_export.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          directory = Path("research-ledger")
          directory.mkdir(exist_ok=True)
          index = directory / "index.json"
          outcome = os.environ["EXPORT_OUTCOME"]
          restore = os.environ["RESTORE_OUTCOME"]
          index_sha = None
          if restore != "success":
              status = "BLOCKED_PILOT_STATE"
          elif outcome != "success":
              status = "LEDGER_EXPORT_FAILED"
          elif not index.is_file() or index.stat().st_size == 0:
              status = "LEDGER_OUTPUT_MISSING_OR_EMPTY"
          else:
              raw = index.read_bytes()
              try:
                  document = json.loads(raw)
                  if (not isinstance(document, dict)
                          or document.get("schema") != "HBI_RESEARCH_LEDGER_V1"
                          or document.get("bet_authority") is not False
                          or document.get("pit_certified") != 0):
                      raise ValueError("Unexpected ledger contract")
              except ValueError:
                  status = "LEDGER_OUTPUT_INVALID"
              else:
                  status = "LEDGER_EXPORTED"
                  index_sha = hashlib.sha256(raw).hexdigest()
          report = {"status": status, "export_outcome": outcome,
                    "restore_outcome": restore, "index_sha256": index_sha,
                    "bet_authority": False, "pit_certified": False}
          (directory / "status.json").write_text(json.dumps(report) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Research ledger — {status}\n")
          if status != "LEDGER_EXPORTED":
              index.unlink(missing_ok=True)
              print(f"::warning::Research ledger — {status}")
          PY

      - name: Upload research ledger (NO BET)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: research-ledger-${{ github.run_id }}
          path: research-ledger/
          if-no-files-found: error
          retention-days: 21

      # Join existing original source/model/coverage/scorecard artifacts. This
      # research sidecar can fail without rewriting or blocking CORE-003 state.
      # Its own outcome remains explicit in GitHub step logs and artifact.
      - name: Generate MVP-016 cumulative research status (NO BET)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && steps.restore.outcome == 'success' && always()
        continue-on-error: true
        run: |
          set -euo pipefail
          for source in \
            dev009-outcome-scorecards/index.json \
            core003-pilot-report.json \
            bet-mvp-shadow/cohort-index.json \
            dev011-coverage/manifest.json; do
            if [ ! -f "$source" ]; then
              echo "::error::MVP016_ORIGINAL_INPUT_MISSING:$source"
              exit 1
            fi
          done
          python -m hbi.mvp016_research_status \
            --scorecard-index dev009-outcome-scorecards/index.json \
            --source-report core003-pilot-report.json \
            --model-cohort-index bet-mvp-shadow/cohort-index.json \
            --coverage-manifest dev011-coverage/manifest.json \
            --output-dir mvp016-research-status

      - name: Upload MVP-016 cumulative read-only research status (NO BET)
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp016-research-status-${{ github.run_id }}
          path: mvp016-research-status/index.json
          if-no-files-found: warn
          retention-days: 21

      # Read-only source readiness from the four existing immutable research originals.
      # Failures remain explicit, but never block/write the CORE-003 model or PIT state.
      - name: Generate MVP-019 prospective source readiness (NO BET)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.execute == 'true' && steps.restore.outcome == 'success' && always()
        continue-on-error: true
        run: |
          set -euo pipefail
          for source in \
            dev009-outcome-scorecards/index.json \
            core003-pilot-report.json \
            bet-mvp-shadow/cohort-index.json \
            dev011-coverage/manifest.json; do
            if [ ! -f "$source" ]; then
              echo "::error::MVP019_ORIGINAL_SOURCE_MISSING:$source"
              exit 1
            fi
          done
          python -m hbi.mvp019_source_readiness \
            --scorecard-index dev009-outcome-scorecards/index.json \
            --source-report core003-pilot-report.json \
            --model-cohort-index bet-mvp-shadow/cohort-index.json \
            --coverage-manifest dev011-coverage/manifest.json \
            --github-run-id "$GITHUB_RUN_ID" \
            --output-dir mvp019-source-readiness

      - name: Upload MVP-019 prospective source readiness (NO BET)
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp019-source-readiness-${{ github.run_id }}
          path: mvp019-source-readiness/index.json
          if-no-files-found: warn
          retention-days: 21
      - name: Upload restored immutable prior model evidence
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pit003a-prior-frozen-models-${{ github.run_id }}
          path: pit003a-prior-models/
          if-no-files-found: ignore
          retention-days: 21

      - name: Upload original T-4 source receipts
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pit003a-source-receipts-${{ github.run_id }}
          path: pit003a-source-receipts/
          if-no-files-found: ignore
          retention-days: 21

      - name: Upload PIT T-4 research attestations (NO BET)
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pit003a-attestations-${{ github.run_id }}
          path: pit003a-attestations/
          if-no-files-found: ignore
          retention-days: 21

      - name: Upload MVP-009 decision diagnostics (RESEARCH ONLY, NO BET)
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp009-decision-audits-${{ github.run_id }}
          path: mvp009-decision-audits/
          if-no-files-found: warn
          retention-days: 21

      - name: Upload DEV-009 prospective outcome scorecard (RESEARCH NO BET)
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: dev009-outcome-scorecards-${{ github.run_id }}
          path: dev009-outcome-scorecards/
          if-no-files-found: warn
          retention-days: 21

      - name: Upload DEV-011 cumulative original coverage manifest (NO BET)
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: dev011-coverage-manifest-${{ github.run_id }}
          path: dev011-coverage/
          if-no-files-found: warn
          retention-days: 21
