name: Betting HQ Nordic acceptance (research)
on:
  pull_request:
    paths:
      - ".github/workflows/hq-nordic-acceptance.yml"
      - "src/hbi/hq_acceptance.py"
      - "src/hbi/hq_daily_operations.py"
      - "src/hbi/hq_daily_report.py"
      - "docs/product-mvp-001/v1-acceptance-inputs.json"
  workflow_dispatch:
    inputs:
      date:
        description: "Oslo date for daily inventory (blank replays pinned originals)"
        required: false
        type: string
  # Before owner-approved activation, bind the job to an authorized runner
  # with HQ_PRIVATE_ARCHIVE_ROOT mounted. Then enable:
  # schedule:
  #   - cron: "30 3 * * *"  # Report previous Oslo date after overnight results.

permissions:
  contents: read
  actions: read

jobs:
  original-replay:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Verify archived sources and render Nordic report
        env:
          REPORT_DATE: ${{ inputs.date }}
          HQ_PRIVATE_ARCHIVE_ROOT: ${{ vars.HQ_PRIVATE_ARCHIVE_ROOT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/hq-originals"
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            if [ -z "$HQ_PRIVATE_ARCHIVE_ROOT" ] || [ ! -d "$HQ_PRIVATE_ARCHIVE_ROOT" ]; then
              echo "::error::HQ_PRIVATE_ARCHIVE_ROOT_UNAVAILABLE"
              exit 1
            fi
            archive="$HQ_PRIVATE_ARCHIVE_ROOT"
            REPORT_DATE="$(python -c 'from datetime import datetime, timedelta; from hbi.providers.rikstoto import OSLO; print(datetime.now(OSLO).date() - timedelta(days=1))')"
          fi
          if [ -n "$REPORT_DATE" ]; then
            python -m hbi.hq_daily_operations --date "$REPORT_DATE" \
              --archive "$archive" --stage "$RUNNER_TEMP/hq-stage" \
              --output hq-report
            exit
          fi
          python -m hbi.hq_acceptance \
            --config docs/product-mvp-001/v1-acceptance-inputs.json \
            --archive "$RUNNER_TEMP/hq-originals" --stage "$RUNNER_TEMP/hq-stage" \
            --output hq-report --download
      - name: Upload derived reports
        uses: actions/upload-artifact@v4
        with:
          name: hq-nordic-acceptance-${{ github.run_id }}
          path: |
            hq-report/betting-hq.html
            hq-report/betting-hq.txt
            hq-report/betting-hq.json
            hq-report/daily-status.json
            hq-report/historical-score.json
          if-no-files-found: error
          retention-days: 21
