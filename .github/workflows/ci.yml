name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q

      # Exactly the real 4 Nov morning Collector original, not a synthetic
      # startlist or a fabricated T-4 receipt. Former parser rejected 3/35.
      - name: Replay MVP-014 4 Nov genuine PDF race headers (NO PIT/BET)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mvp014-nov04"
          gh run download 41784797103 --repo Maremoo2/rikstoto-program-collector \
            --name rikstoto-morning-programs --dir "$RUNNER_TEMP/mvp014-nov04"
          MVP014_NOV04_COLLECTOR_ORIGINAL_ROOT="$RUNNER_TEMP/mvp014-nov04" \
            pytest -q tests/test_mvp014_pdf_header_clock.py
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from hbi.collector_handoff import pdf_field
          root = Path(os.environ["RUNNER_TEMP"]) / "mvp014-nov04"
          manifests = list(root.rglob("manifest.json"))
          assert len(manifests) == 1
          folder = manifests[0].parent / "meetings"
          counts = {}
          original_sha = {}
          for meeting in ("F1_NR_2026-11-04", "F2_NR_2026-11-04",
                          "S1_NR_2026-11-04", "S2_NR_2026-11-04",
                          "S3_NR_2026-11-04"):
              source = folder / meeting
              pdf_raw = (source / "full_program.pdf").read_bytes()
              starts_raw = (source / "starts.raw.json").read_bytes()
              field = json.loads(starts_raw)["result"]
              n = 0
              for race_no, rows in field.items():
                  runners = {str(r["startNumber"]): {"name": r["horseName"]}
                             for r in rows}
                  assert pdf_field(pdf_raw, int(race_no), runners, "2026-11-04")
                  n += 1
              counts[meeting] = n
              original_sha[meeting] = {
                  "pdf": hashlib.sha256(pdf_raw).hexdigest(),
                  "starts": hashlib.sha256(starts_raw).hexdigest(),
              }
          assert sum(counts.values()) == 35
          result = {
              "evidence_mode": "GITHUB_ORIGINAL_COLLECTOR_MORNING_NOT_T4",
              "collector_run_id": 41784797103,
              "original_sha256": original_sha,
              "physical_races_per_meeting": counts,
              "total_physical_pdf_fullfield_replays": 35,
              "parser_status": "35_OF_35_PASS",
              "pit_certified": False,
              "bet_authority": False,
          }
          (root / "mvp014-original-pdf-replay.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload MVP-014 original 4 Nov PDF replay evidence (NO BET)
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp014-original-pdf-headers-${{ github.run_id }}
          path: ${{ runner.temp }}/mvp014-nov04/mvp014-original-pdf-replay.json
          if-no-files-found: warn
          retention-days: 30

      # Exact observed 4 Nov 2026 no-op index. A valid empty cohort must
      # contribute zero races without creating a false archive error.
      - name: Replay MVP-016 original empty CORE-003 cohort (NO BET)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mvp016-empty"
          gh run download 41796128435 --repo "$GITHUB_REPOSITORY" \
            --name bet-mvp-shadow-41796128435 \
            --dir "$RUNNER_TEMP/mvp016-empty"
          printf '%s  %s\n' \
            ebeb64f1fc27328c0ff5f063ede33ec1d08615e482d4a017680ea0d5813b9aa0 \
            "$RUNNER_TEMP/mvp016-empty/cohort-index.json" | sha256sum --check -
          MVP016_EMPTY_COHORT_ORIGINAL_ROOT="$RUNNER_TEMP/mvp016-empty" \
            pytest -q tests/test_mvp016_empty_cohort.py
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from hbi.prospective_outcome_scorecard import read_archived_models
          root = Path(os.environ["RUNNER_TEMP"]) / "mvp016-empty"
          raw = (root / "cohort-index.json").read_bytes()
          models, errors, physical_races = read_archived_models(root)
          assert models == errors == physical_races == []
          report = {
              "schema": "MVP016_ORIGINAL_NOOP_COHORT_REPLAY_V1",
              "original_source_run": 41796128435,
              "original_sha256": hashlib.sha256(raw).hexdigest(),
              "model_reports_admitted": len(models),
              "physical_races_added": len(physical_races),
              "archive_errors": errors,
              "pit_certified": False,
              "bet_authority": False,
          }
          (root / "mvp016-empty-original-replay.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload MVP-016 original empty cohort replay (NO BET)
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp016-empty-cohort-original-${{ github.run_id }}
          path: ${{ runner.temp }}/mvp016-empty/mvp016-empty-original-replay.json
          if-no-files-found: warn
          retention-days: 30

      # Real scheduled 4 Nov source inventory changed during pagination.
      # Protect cumulative benchmark from a falsely zero-count published scorecard.
      - name: Replay MVP-016 genuine GitHub inventory outage (NO BET)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mvp016-inventory"
          mkdir -p "$root"/{outage,healthy,false_zero}
          gh run download 41817026855 --repo "$GITHUB_REPOSITORY" \
            --name dev011-coverage-manifest-41817026855 --dir "$root/outage"
          gh run download 41814068321 --repo "$GITHUB_REPOSITORY" \
            --name dev011-coverage-manifest-41814068321 --dir "$root/healthy"
          gh run download 41817026855 --repo "$GITHUB_REPOSITORY" \
            --name dev009-outcome-scorecards-41817026855 --dir "$root/false_zero"
          printf '%s  %s\n' \
            b14c61c979c656e49da382d574f3416293303e582b3b864b646df592282c4ac7 \
            "$root/outage/manifest.json" | sha256sum --check -
          printf '%s  %s\n' \
            ecb4477a0ec5fc9c954862943ab8b39876d7b13c6adf701bf4e777eaa9f9df33 \
            "$root/healthy/manifest.json" | sha256sum --check -
          printf '%s  %s\n' \
            be7604e5b9604aa5439769e716038ad863854588fb6340b8333b4f77392e4481 \
            "$root/false_zero/index.json" | sha256sum --check -
          MVP016_INVENTORY_OUTAGE_ORIGINAL_ROOT="$root" \
            pytest -q tests/test_mvp016_inventory_outage.py
          # A blocked original must *not* produce the current cumulative
          # report's misleading zero-race index.
          set +e
          python -m hbi.mvp016_inventory_guard \
            --manifest "$root/outage/manifest.json" \
            --output-dir "$root/research-status"
          code=$?
          set -e
          test "$code" -eq 3
          test -f "$root/research-status/source-unavailable.json"
          test ! -e "$root/research-status/index.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "mvp016-inventory"
          row = json.loads((root / "research-status/source-unavailable.json").read_text())
          assert row["schema"] == "MVP016_CUMULATIVE_SCORECARD_SOURCE_UNAVAILABLE_V1"
          assert row["source_reason"] == "PAGINATED_GITHUB_INVENTORY_UNAVAILABLE"
          assert row["cumulative_physical_races"] is None
          assert row["scorecard_generated"] is False
          assert row["bet_authority"] is False
          PY

      - name: Upload MVP-016 original inventory outage replay evidence
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp016-original-inventory-outage-${{ github.run_id }}
          path: ${{ runner.temp }}/mvp016-inventory/research-status/source-unavailable.json
          if-no-files-found: warn
          retention-days: 30

      # Genuine 4 November four-original scorecard join: never a PIT certificate.
      - name: Replay MVP-016 original research status (NO BET)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/mvp016-research"
          mkdir -p "$folder"/{scorecard,source,cohort,manifest}
          gh run download 41814068321 --repo "$GITHUB_REPOSITORY" \
            --name dev009-outcome-scorecards-41814068321 --dir "$folder/scorecard"
          gh run download 41814068321 --repo "$GITHUB_REPOSITORY" \
            --name core003-pilot-report-41814068321 --dir "$folder/source"
          gh run download 41814068321 --repo "$GITHUB_REPOSITORY" \
            --name bet-mvp-shadow-41814068321 --dir "$folder/cohort"
          gh run download 41814068321 --repo "$GITHUB_REPOSITORY" \
            --name dev011-coverage-manifest-41814068321 --dir "$folder/manifest"
          printf '%s  %s\n' \
            62b0d78ca75847d2f2bfe895af240e45eada96a7719aefe4f880c1da02cbe178 \
            "$folder/scorecard/index.json" | sha256sum --check -
          printf '%s  %s\n' \
            151168c074b7d1f0c92bb1c568f70bd23d2669a8903540a26c9b97f32121a7d7 \
            "$folder/source/core003-pilot-report.json" | sha256sum --check -
          printf '%s  %s\n' \
            3b804af346a340c6713b64319fd4201881040a264360e4a014069bb60c3e7cd0 \
            "$folder/cohort/cohort-index.json" | sha256sum --check -
          printf '%s  %s\n' \
            ecb4477a0ec5fc9c954862943ab8b39876d7b13c6adf701bf4e777eaa9f9df33 \
            "$folder/manifest/manifest.json" | sha256sum --check -
          MVP016_RESEARCH_ORIGINAL_ROOT="$folder" \
            pytest -q tests/test_mvp016_research_status.py
          python -m hbi.mvp016_research_status \
            --scorecard-index "$folder/scorecard/index.json" \
            --source-report "$folder/source/core003-pilot-report.json" \
            --model-cohort-index "$folder/cohort/cohort-index.json" \
            --coverage-manifest "$folder/manifest/manifest.json" \
            --output-dir "$folder/report"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          folder = Path(os.environ["RUNNER_TEMP"]) / "mvp016-research"
          result = json.loads((folder / "report/index.json").read_text())
          assert result["schema"] == "MVP016_CUMULATIVE_RESEARCH_STATUS_V1"
          assert result["counts"]["physical_races"] == 63
          assert result["counts"]["paired_champion_core004"] == 16
          assert result["counts"]["triple_evaluable"] == 14
          assert result["counts"]["current_source_fixed_cohort"] == 2
          assert result["counts"]["current_source_rejected"] == 2
          assert result["counts"]["pit_certified_paired"] == 0
          assert result["bet_authority"] is False
          assert all(row["bet_authority"] is False for row in result["per_physical_race"])
          PY

      - name: Upload MVP-016 original joined research-status evidence
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp016-original-research-status-${{ github.run_id }}
          path: ${{ runner.temp }}/mvp016-research/report/index.json
          if-no-files-found: warn
          retention-days: 30

      # Local scratch-only archive replay. Never upload the copied raw original.
      - name: Replay MVP-017 private local original archive on true GitHub bytes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mvp017-original"
          gh run download 41796128435 --repo "$GITHUB_REPOSITORY" \
            --name bet-mvp-shadow-41796128435 \
            --dir "$RUNNER_TEMP/mvp017-original"
          printf '%s  %s\n' \
            ebeb64f1fc27328c0ff5f063ede33ec1d08615e482d4a017680ea0d5813b9aa0 \
            "$RUNNER_TEMP/mvp017-original/cohort-index.json" | sha256sum --check -
          MVP017_PRIVATE_ARCHIVE_ORIGINAL_ROOT="$RUNNER_TEMP/mvp017-original" \
            pytest -q tests/test_mvp017_private_original_archive.py
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from hbi.mvp017_private_original_archive import store_original, verify_archive
          base = Path(os.environ["RUNNER_TEMP"]) / "mvp017-original"
          raw = base / "cohort-index.json"
          root = Path(os.environ["RUNNER_TEMP"]) / "mvp017-scratch-private"
          output = store_original(
              archive_root=root, source_file=raw,
              source_provider="RIKSTOTO",
              endpoint="/api/racedays",
              observed_at_utc="2026-11-04T07:59:00+00:00",
              source_run_id=41796128435, source_artifact_id=13304793845,
              approval_id="CI_LOCAL_SCRATCH_ONLY_MVP017",
          )
          verified = verify_archive(root)
          assert verified["original_source_blobs"] == 1
          assert verified["pit_certified"] is False and verified["bet_authority"] is False
          assert output["original_sha256"] == hashlib.sha256(raw.read_bytes()).hexdigest()
          attestation = {
              "schema": "MVP017_LOCAL_REPLAY_EVIDENCE_V1",
              "original_sha256": output["original_sha256"],
              "receipt_sha256": output["receipt_sha256"],
              "local_blob_count": verified["original_source_blobs"],
              "local_receipt_count": verified["distinct_provenance_receipts"],
              "external_retention_deployed": False,
              "bet_authority": False,
              "pit_certified": False,
          }
          (base / "evidence.json").write_text(
              json.dumps(attestation, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload MVP-017 metadata-only archive evidence (no raw bytes)
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp017-local-private-archive-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/mvp017-original/evidence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Replay DEV-012 against original 3 Nov Vincennes PDF and starts
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dev012-original"
          gh run download 41663427015 --repo "$GITHUB_REPOSITORY" \
            --name pit003a-collector-evidence-41663427015 \
            --dir "$RUNNER_TEMP/dev012-original"
          HBI_DEV012_AUTHENTIC_ARCHIVE="$RUNNER_TEMP/dev012-original" \
            pytest -q tests/test_dev012_pdf_continuation.py

      - name: Replay authenticated Collector originals through isolated SQLite model gate
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mvp003/collector" "$RUNNER_TEMP/mvp003/sqlite" \
            "$RUNNER_TEMP/mvp003/model" "$RUNNER_TEMP/mvp003/source"
          # These are immutable, prior-run ORIGINAL artifacts, not new provider
          # requests and not a retrospective PIT attempt.
          gh run download 41399902762 --repo Maremoo2/rikstoto-program-collector \
            --name rikstoto-morning-programs --dir "$RUNNER_TEMP/mvp003/collector"
          gh run download 41518035718 --repo "$GITHUB_REPOSITORY" \
            --name core003-pilot-state --dir "$RUNNER_TEMP/mvp003/sqlite"
          gh run download 41518035718 --repo "$GITHUB_REPOSITORY" \
            --name bet-mvp-shadow-41518035718 --dir "$RUNNER_TEMP/mvp003/model"
          gh run download 41518035718 --repo "$GITHUB_REPOSITORY" \
            --name core003-pilot-report-41518035718 --dir "$RUNNER_TEMP/mvp003/source"
          printf '%s  %s\n' \
            60dbb4d350c252fd1f6dd7d8ba2c19e841153bd0e260318938e1b888bda913b0 \
            "$RUNNER_TEMP/mvp003/sqlite/core003-pilot.sqlite" | sha256sum --check -
          printf '%s  %s\n' \
            dea4abdf8fed71c137274100153bfaec2323d608faec4072a569b4728cc789fe \
            "$RUNNER_TEMP/mvp003/model/race-002/shadow.json" | sha256sum --check -
          MVP003_COLLECTOR_ROOT="$RUNNER_TEMP/mvp003/collector" \
          MVP003_ORIGINAL_SQLITE="$RUNNER_TEMP/mvp003/sqlite/core003-pilot.sqlite" \
          MVP003_ORIGINAL_SHADOW="$RUNNER_TEMP/mvp003/model/race-002/shadow.json" \
          MVP003_ORIGINAL_SOURCE_REPORT="$RUNNER_TEMP/mvp003/source/core003-pilot-report.json" \
          MVP004_EVIDENCE_DIR="$RUNNER_TEMP/mvp004-historical-report" \
            pytest -q -s tests/test_collector_handoff_real_archive.py

      - name: Replay frozen Eskilstuna originals through automatic MVP-009 diagnostics
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mvp009/bet-mvp-shadow" \
            "$RUNNER_TEMP/mvp009/pit003a-attestations"
          gh run download 41626023709 --repo "$GITHUB_REPOSITORY" \
            --name bet-mvp-shadow-41626023709 \
            --dir "$RUNNER_TEMP/mvp009/bet-mvp-shadow"
          gh run download 41626023709 --repo "$GITHUB_REPOSITORY" \
            --name pit003a-attestations-41626023709 \
            --dir "$RUNNER_TEMP/mvp009/pit003a-attestations"
          printf '%s  %s\n' \
            4853ed6bc8c7c7063a5898f4b815e552989d29d9b3121372fd338eb0e63f9916 \
            "$RUNNER_TEMP/mvp009/bet-mvp-shadow/race-001/shadow.json" | sha256sum --check -
          MVP009_ESKILSTUNA_ARCHIVE_ROOT="$RUNNER_TEMP/mvp009" \
            pytest -q tests/test_mvp009_auto_decision_audit.py
          python -m hbi.mvp009_auto_decision_audit \
            --cohort-index "$RUNNER_TEMP/mvp009/bet-mvp-shadow/cohort-index.json" \
            --attestation-index "$RUNNER_TEMP/mvp009/pit003a-attestations/index.json" \
            --output-dir "$RUNNER_TEMP/mvp009/mvp009-decision-audits"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "mvp009/mvp009-decision-audits"
          index = json.loads((root / "index.json").read_text())
          assert index["status"] == "DIAGNOSTIC_COMPLETE_RESEARCH_ONLY"
          assert index["model_reports_expected"] == index["model_reports_diagnosed"] == 2
          assert index["errors"] == [] and index["bet_authority"] is False
          rows = {row["race_id"]: row for row in index["records"]}
          r1 = rows["RIKSTOTO:S1_NR_2026-11-03:1"]
          assert r1["active"] == r1["runners"] == 12 and r1["attestation_matched"] is True
          assert r1["market_full_field"] is True
          for entry in index["records"]:
              report = json.loads((root / entry["diagnostic_path"]).read_text())
              assert report["v33_evaluator_called"] is False
              assert report["bet_authority"] is False
              assert all(horse["stake_nok"] is None for horse in report["runners"])
              assert all(horse["decision"] in {"BLOCKED", "PASS_NOT_ACTIVE"}
                         for horse in report["runners"])
          PY

      - name: Upload real-original MVP-009 decision diagnostics (NO BET)
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp009-original-decision-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/mvp009/mvp009-decision-audits
          if-no-files-found: warn
          retention-days: 30

      - name: Replay DEV-009 outcome scorecard on original frozen Eskilstuna archive
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dev009/models/41646155051"
          gh run download 41646155051 --repo "$GITHUB_REPOSITORY" \
            --name bet-mvp-shadow-41646155051 \
            --dir "$RUNNER_TEMP/dev009/models/41646155051"
          printf '%s  %s\n' \
            f04dd8f19254764114739009383371e3367c445c917c8fac5b08cf085e814a6d \
            "$RUNNER_TEMP/dev009/models/41646155051/race-001/shadow.json" \
            | sha256sum --check -
          DEV009_AUTHENTIC_ARCHIVE_ROOT="$RUNNER_TEMP/dev009/models" \
            pytest -q tests/test_prospective_outcome_scorecard.py
          python -m hbi.prospective_outcome_scorecard \
            --models-root "$RUNNER_TEMP/dev009/models" \
            --output-dir "$RUNNER_TEMP/dev009/scorecard" \
            --fetch-official
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                             "dev009/scorecard/index.json").read_text())
          assert data["bet_authority"] is False
          assert data["v33_evaluator_called"] is False
          assert data["counts"]["physical_races"] == 3
          assert data["counts"]["complete_prediction_fields"] == 1
          assert data["counts"]["not_evaluable"] >= 2
          record = next(r for r in data["records"]
                        if r["race_id"] == "RIKSTOTO:S1_NR_2026-11-03:8")
          assert record["source_model_original_sha256"] == (
              "f04dd8f19254764114739009383371e3367c445c917c8fac5b08cf085e814a6d"
          )
          assert record["active_runners"] == 12
          assert record["cohort"] == "PROSPECTIVE_NOT_PIT_CERTIFIED"
          assert record["status"] in ("EVALUABLE_RESEARCH_ONLY", "NOT_EVALUABLE")
          if record["status"] == "EVALUABLE_RESEARCH_ONLY":
              assert len(record["original_result_receipts"]) == 2
              assert all(r["raw_sha256"] for r in record["original_result_receipts"])
          PY

      - name: Upload DEV-009 original archive scorecard (NO BET)
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: dev009-authentic-original-scorecard-${{ github.run_id }}
          path: ${{ runner.temp }}/dev009/scorecard/
          if-no-files-found: warn
          retention-days: 30

      # Five genuine model archives from 2 Nov exist on GitHub, but predate
      # the immutable cohort index. Do not turn them into admitted models.
      - name: Replay MVP-014 original legacy-index classification (NO PIT/BET)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
