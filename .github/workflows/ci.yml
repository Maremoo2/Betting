name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q

      - name: Replay authenticated Collector originals through isolated SQLite model gate
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mvp003/collector" "$RUNNER_TEMP/mvp003/sqlite" \
            "$RUNNER_TEMP/mvp003/model" "$RUNNER_TEMP/mvp003/source"
          # These are immutable, prior-run ORIGINAL artifacts, not new provider
          # requests and not a retrospective PIT attempt.
          gh run download 41399902762 --repo Maremoo2/rikstoto-program-collector \
            --name rikstoto-morning-programs --dir "$RUNNER_TEMP/mvp003/collector"
          gh run download 41518035718 --repo "$GITHUB_REPOSITORY" \
            --name core003-pilot-state --dir "$RUNNER_TEMP/mvp003/sqlite"
          gh run download 41518035718 --repo "$GITHUB_REPOSITORY" \
            --name bet-mvp-shadow-41518035718 --dir "$RUNNER_TEMP/mvp003/model"
          gh run download 41518035718 --repo "$GITHUB_REPOSITORY" \
            --name core003-pilot-report-41518035718 --dir "$RUNNER_TEMP/mvp003/source"
          printf '%s  %s\n' \
            60dbb4d350c252fd1f6dd7d8ba2c19e841153bd0e260318938e1b888bda913b0 \
            "$RUNNER_TEMP/mvp003/sqlite/core003-pilot.sqlite" | sha256sum --check -
          printf '%s  %s\n' \
            dea4abdf8fed71c137274100153bfaec2323d608faec4072a569b4728cc789fe \
            "$RUNNER_TEMP/mvp003/model/race-002/shadow.json" | sha256sum --check -
          MVP003_COLLECTOR_ROOT="$RUNNER_TEMP/mvp003/collector" \
          MVP003_ORIGINAL_SQLITE="$RUNNER_TEMP/mvp003/sqlite/core003-pilot.sqlite" \
          MVP003_ORIGINAL_SHADOW="$RUNNER_TEMP/mvp003/model/race-002/shadow.json" \
          MVP003_ORIGINAL_SOURCE_REPORT="$RUNNER_TEMP/mvp003/source/core003-pilot-report.json" \
          MVP004_EVIDENCE_DIR="$RUNNER_TEMP/mvp004-historical-report" \
            pytest -q -s tests/test_collector_handoff_real_archive.py

      - name: Replay frozen Eskilstuna originals through automatic MVP-009 diagnostics
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mvp009/bet-mvp-shadow" \
            "$RUNNER_TEMP/mvp009/pit003a-attestations"
          gh run download 41626023709 --repo "$GITHUB_REPOSITORY" \
            --name bet-mvp-shadow-41626023709 \
            --dir "$RUNNER_TEMP/mvp009/bet-mvp-shadow"
          gh run download 41626023709 --repo "$GITHUB_REPOSITORY" \
            --name pit003a-attestations-41626023709 \
            --dir "$RUNNER_TEMP/mvp009/pit003a-attestations"
          printf '%s  %s\n' \
            4853ed6bc8c7c7063a5898f4b815e552989d29d9b3121372fd338eb0e63f9916 \
            "$RUNNER_TEMP/mvp009/bet-mvp-shadow/race-001/shadow.json" | sha256sum --check -
          MVP009_ESKILSTUNA_ARCHIVE_ROOT="$RUNNER_TEMP/mvp009" \
            pytest -q tests/test_mvp009_auto_decision_audit.py
          python -m hbi.mvp009_auto_decision_audit \
            --cohort-index "$RUNNER_TEMP/mvp009/bet-mvp-shadow/cohort-index.json" \
            --attestation-index "$RUNNER_TEMP/mvp009/pit003a-attestations/index.json" \
            --output-dir "$RUNNER_TEMP/mvp009/mvp009-decision-audits"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "mvp009/mvp009-decision-audits"
          index = json.loads((root / "index.json").read_text())
          assert index["status"] == "DIAGNOSTIC_COMPLETE_RESEARCH_ONLY"
          assert index["model_reports_expected"] == index["model_reports_diagnosed"] == 2
          assert index["errors"] == [] and index["bet_authority"] is False
          rows = {row["race_id"]: row for row in index["records"]}
          r1 = rows["RIKSTOTO:S1_NR_2026-11-03:1"]
          assert r1["active"] == r1["runners"] == 12 and r1["attestation_matched"] is True
          assert r1["market_full_field"] is True
          for entry in index["records"]:
              report = json.loads((root / entry["diagnostic_path"]).read_text())
              assert report["v33_evaluator_called"] is False
              assert report["bet_authority"] is False
              assert all(horse["stake_nok"] is None for horse in report["runners"])
              assert all(horse["decision"] in {"BLOCKED", "PASS_NOT_ACTIVE"}
                         for horse in report["runners"])
          PY

      - name: Upload real-original MVP-009 decision diagnostics (NO BET)
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp009-original-decision-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/mvp009/mvp009-decision-audits
          if-no-files-found: warn
          retention-days: 30

      - name: Replay DEV-009 outcome scorecard on original frozen Eskilstuna archive
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dev009/models/41646155051"
          gh run download 41646155051 --repo "$GITHUB_REPOSITORY" \
            --name bet-mvp-shadow-41646155051 \
            --dir "$RUNNER_TEMP/dev009/models/41646155051"
          printf '%s  %s\n' \
            f04dd8f19254764114739009383371e3367c445c917c8fac5b08cf085e814a6d \
            "$RUNNER_TEMP/dev009/models/41646155051/race-001/shadow.json" \
            | sha256sum --check -
          DEV009_AUTHENTIC_ARCHIVE_ROOT="$RUNNER_TEMP/dev009/models" \
            pytest -q tests/test_prospective_outcome_scorecard.py
          python -m hbi.prospective_outcome_scorecard \
            --models-root "$RUNNER_TEMP/dev009/models" \
            --output-dir "$RUNNER_TEMP/dev009/scorecard" \
            --fetch-official
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                             "dev009/scorecard/index.json").read_text())
          assert data["bet_authority"] is False
          assert data["v33_evaluator_called"] is False
          assert data["counts"]["physical_races"] == 3
          assert data["counts"]["complete_prediction_fields"] == 1
          assert data["counts"]["not_evaluable"] >= 2
          record = next(r for r in data["records"]
                        if r["race_id"] == "RIKSTOTO:S1_NR_2026-11-03:8")
          assert record["source_model_original_sha256"] == (
              "f04dd8f19254764114739009383371e3367c445c917c8fac5b08cf085e814a6d"
          )
          assert record["active_runners"] == 12
          assert record["cohort"] == "PROSPECTIVE_NOT_PIT_CERTIFIED"
          assert record["status"] in ("EVALUABLE_RESEARCH_ONLY", "NOT_EVALUABLE")
          if record["status"] == "EVALUABLE_RESEARCH_ONLY":
              assert len(record["original_result_receipts"]) == 2
              assert all(r["raw_sha256"] for r in record["original_result_receipts"])
          PY

      - name: Upload DEV-009 original archive scorecard (NO BET)
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: dev009-authentic-original-scorecard-${{ github.run_id }}
          path: ${{ runner.temp }}/dev009/scorecard/
          if-no-files-found: warn
          retention-days: 30

      - name: Replay DEV-011 retained Eskilstuna model and pinned originals (21 empty runs)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dev011/models/41646155051" \
            "$RUNNER_TEMP/dev011/results/41662283155"
          gh run download 41646155051 --repo "$GITHUB_REPOSITORY" \
            --name bet-mvp-shadow-41646155051 \
            --dir "$RUNNER_TEMP/dev011/models/41646155051"
          gh run download 41662283155 --repo "$GITHUB_REPOSITORY" \
            --name dev009-authentic-original-scorecard-41662283155 \
            --dir "$RUNNER_TEMP/dev011/results/41662283155"
          printf '%s  %s\n' \
            f04dd8f19254764114739009383371e3367c445c917c8fac5b08cf085e814a6d \
            "$RUNNER_TEMP/dev011/models/41646155051/race-001/shadow.json" \
            | sha256sum --check -
          DEV011_AUTHENTIC_MODEL_ROOT="$RUNNER_TEMP/dev011/models" \
          DEV011_AUTHENTIC_RESULTS_ROOT="$RUNNER_TEMP/dev011/results" \
            pytest -q tests/test_dev011_coverage.py
          python -m hbi.prospective_outcome_scorecard \
            --models-root "$RUNNER_TEMP/dev011/models" \
            --prior-results-root "$RUNNER_TEMP/dev011/results" \
            --output-dir "$RUNNER_TEMP/dev011/scorecard"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "dev011/scorecard"
          result = json.loads((root / "index.json").read_bytes())
          assert result["counts"]["paired_champion_core004"] == 1
          assert result["counts"]["pit_certified_paired"] == 0
          assert result["bet_authority"] is False
          record = next(r for r in result["records"]
                        if r["race_id"] == "RIKSTOTO:S1_NR_2026-11-03:8")
          assert record["winner_selection_id"] == "5"
          assert record["source_model_original_sha256"] == (
              "f04dd8f19254764114739009383371e3367c445c917c8fac5b08cf085e814a6d"
          )
          assert record["outcome_source_mode"] == "PINNED_ARCHIVED_ORIGINAL"
          assert all(r["raw_sha256"] and Path(r["raw_path"]).is_file()
                     for r in record["original_result_receipts"])
          PY

      - name: Upload DEV-011 real original cumulative scorecard (NO BET)
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: dev011-authentic-cumulative-scorecard-${{ github.run_id }}
          path: ${{ runner.temp }}/dev011/scorecard/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload immutable historical research model and Collector source provenance
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp004-historical-research-${{ github.run_id }}
          path: ${{ runner.temp }}/mvp004-historical-report
          if-no-files-found: warn
          retention-days: 30
