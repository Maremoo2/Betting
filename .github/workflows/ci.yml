name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      replay_v2_status: ${{ steps.replay_v2.outcome }}
      replay_v2_artifact_id: ${{ steps.replay_v2_publish.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Only owner-authored, same-repository PRs with pinned fetch code receive the
      # private read credential. Never pass it to pytest, replay or uploads.
      - name: Read approved private CI originals with reviewed fetch code
        if: >-
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == 'Maremoo2/Betting' &&
           github.event.pull_request.user.login == 'Maremoo2') ||
          (github.actor == 'Maremoo2' &&
           ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'workflow_dispatch' &&
             (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/private-ci-source-archive'))))
        env:
          RESEARCH_ARCHIVE_READ_TOKEN: ${{ secrets.RESEARCH_ARCHIVE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            886b25e7e6b3a8663bb7922895a5c3f8f03e82ae027386aa184c47552b3d2a1a scripts/mvp016_source_recovery.py \
            b116322c332f259bb784901d197cbb2170b3fcfe2eacb63afe3dd789e8101408 docs/MVP016_SOURCE_ARCHIVE.json \
            dbc6d5aecaaae6912740055b0ca36ff0e730571174d6983a210485e1ccd0d36a scripts/ci_originals.py \
            79fa4d40261194092f0e284842139103b9481868b25928f3fc9b71f495906d48 src/hbi/ci_originals.py \
            68dd1d131ce043c1da4b7900cfb1c6a97a4a974834da449073ca1a9973b2d606 docs/CI_HISTORICAL_SOURCES.json | sha256sum --check -
          python -I -S scripts/mvp016_source_recovery.py --root "$RUNNER_TEMP/mvp016-empty"
          python -I -S scripts/ci_originals.py fetch --root "$RUNNER_TEMP/ci-originals"
          echo "CI_ORIGINAL_CACHE=$RUNNER_TEMP/ci-originals" >> "$GITHUB_ENV"

      - name: Validate exact HQ-approved source-loss scope
        id: source_plan
        run: python scripts/ci_originals.py historical-plan --report "$RUNNER_TEMP/historical-source-plan.json"

      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q

      # Exactly the real 4 Nov morning Collector original, not a synthetic
      # startlist or a fabricated T-4 receipt. Former parser rejected 3/35.
      - name: Replay MVP-014 4 Nov genuine PDF race headers (NO PIT/BET)
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/private-ci-source-archive'))
        env:
          # Public Collector archive; keep exact original SHA, use scoped CI access.
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mvp014-nov04"
          archive="$RUNNER_TEMP/mvp014-nov04.zip"
          python scripts/ci_originals.py copy --artifact-id 13300048964 --dir "$archive"
          printf '%s  %s\n' \
            9d045fe402348a9465734198bb56dd9a415d6b135141ac6b16c294a053a10dab \
            "$archive" | sha256sum --check -
          python -m zipfile -e "$archive" "$RUNNER_TEMP/mvp014-nov04"
          MVP014_NOV04_COLLECTOR_ORIGINAL_ROOT="$RUNNER_TEMP/mvp014-nov04" \
            pytest -q tests/test_mvp014_pdf_header_clock.py
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from hbi.collector_handoff import pdf_field
          root = Path(os.environ["RUNNER_TEMP"]) / "mvp014-nov04"
          manifests = list(root.rglob("manifest.json"))
          assert len(manifests) == 1
          folder = manifests[0].parent / "meetings"
          counts = {}
          original_sha = {}
          for meeting in ("F1_NR_2026-11-04", "F2_NR_2026-11-04",
                          "S1_NR_2026-11-04", "S2_NR_2026-11-04",
                          "S3_NR_2026-11-04"):
              source = folder / meeting
              pdf_raw = (source / "full_program.pdf").read_bytes()
              starts_raw = (source / "starts.raw.json").read_bytes()
              field = json.loads(starts_raw)["result"]
              n = 0
              for race_no, rows in field.items():
                  runners = {str(r["startNumber"]): {"name": r["horseName"]}
                             for r in rows}
                  assert pdf_field(pdf_raw, int(race_no), runners, "2026-11-04")
                  n += 1
              counts[meeting] = n
              original_sha[meeting] = {
                  "pdf": hashlib.sha256(pdf_raw).hexdigest(),
                  "starts": hashlib.sha256(starts_raw).hexdigest(),
              }
          assert sum(counts.values()) == 35
          result = {
              "evidence_mode": "GITHUB_ORIGINAL_COLLECTOR_MORNING_NOT_T4",
              "collector_run_id": 41784797103,
              "original_sha256": original_sha,
              "physical_races_per_meeting": counts,
              "total_physical_pdf_fullfield_replays": 35,
              "parser_status": "35_OF_35_PASS",
              "pit_certified": False,
              "bet_authority": False,
          }
          (root / "mvp014-original-pdf-replay.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload MVP-014 original 4 Nov PDF replay evidence (NO BET)
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/private-ci-source-archive')) && always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp014-original-pdf-headers-${{ github.run_id }}
          path: ${{ runner.temp }}/mvp014-nov04/mvp014-original-pdf-replay.json
          if-no-files-found: warn
          retention-days: 30

      # HQ-authorized NEW corpus. The old test and pinned SHA remain unchanged;
      # its status is NOT_REPRODUCIBLE_SOURCE_EXPIRED, never V2 PASS.
      - name: Replay CORE003_AUTHENTIC_REPLAY_V2 through unchanged SQLite model gate
        id: replay_v2
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/private-ci-source-archive'))
        env:
          # Final V2 mirror is in this repository; do not consume the shared
          # cross-repository Collector installation token for same-repo reads.
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/core003_replay_v2.py fetch --root "$RUNNER_TEMP/core003-v2-input"
          CORE003_REPLAY_V2_INPUT_ROOT="$RUNNER_TEMP/core003-v2-input" \
          CORE003_REPLAY_V2_EVIDENCE="$RUNNER_TEMP/core003-v2-output" \
          CORE003_REPLAY_V2_REQUIRED=1 \
            pytest -q -s tests/test_core003_authentic_replay_v2.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          contract = json.loads(Path('docs/CORE003_AUTHENTIC_REPLAY_V2.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('bootstrap=' + str(contract['mirror'] is None).lower() + '\n')
          PY

      - name: Confirm bootstrap originals retained privately
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/private-ci-source-archive')) && steps.replay_v2.outputs.bootstrap == 'true'
        run: python scripts/ci_originals.py verify-cache

      - name: Encrypt exact SQLite handoff before public artifact transport
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/private-ci-source-archive')) && steps.replay_v2.outcome == 'success'
        run: python -m hbi.ci_readback_transport seal --source "$RUNNER_TEMP/core003-v2-output" --destination "$RUNNER_TEMP/core003-v2-encrypted"

      - name: Publish V2 SQLite and receipt for separate-runner readback
        id: replay_v2_publish
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/private-ci-source-archive'))
        uses: actions/upload-artifact@v4
        with:
          name: core003-authentic-replay-v2-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/core003-v2-encrypted/
          if-no-files-found: error
          retention-days: 7

      # Exact observed 4 Nov 2026 no-op index. A valid empty cohort must
      # contribute zero races without creating a false archive error.
      - name: Replay MVP-016 original empty CORE-003 cohort (NO BET)
        id: mvp016_original
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/private-ci-source-archive'))
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            ebeb64f1fc27328c0ff5f063ede33ec1d08615e482d4a017680ea0d5813b9aa0 \
            "$RUNNER_TEMP/mvp016-empty/cohort-index.json" | sha256sum --check -
          MVP016_EMPTY_COHORT_ORIGINAL_ROOT="$RUNNER_TEMP/mvp016-empty" \
            pytest -q tests/test_mvp016_empty_cohort.py
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from hbi.prospective_outcome_scorecard import read_archived_models
          root = Path(os.environ["RUNNER_TEMP"]) / "mvp016-empty"
          raw = (root / "cohort-index.json").read_bytes()
          models, errors, physical_races = read_archived_models(root)
          assert models == errors == physical_races == []
          report = {
              "schema": "MVP016_ORIGINAL_NOOP_COHORT_REPLAY_V1",
              "original_source_run": 41796128435,
              "original_sha256": hashlib.sha256(raw).hexdigest(),
              "model_reports_admitted": len(models),
              "physical_races_added": len(physical_races),
              "archive_errors": errors,
              "pit_certified": False,
              "bet_authority": False,
          }
          (root / "mvp016-empty-original-replay.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload MVP-016 original empty cohort replay (NO BET)
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/private-ci-source-archive')) && always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp016-empty-cohort-original-${{ github.run_id }}
          path: ${{ runner.temp }}/mvp016-empty/mvp016-empty-original-replay.json
          if-no-files-found: warn
          retention-days: 30

      # Real scheduled 4 Nov source inventory changed during pagination.
      # Protect cumulative benchmark from a falsely zero-count published scorecard.
      - name: Replay MVP-017 private local original archive on true GitHub bytes
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/private-ci-source-archive'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mvp017-original"
          python scripts/ci_originals.py extract --run 41796128435 --name bet-mvp-shadow-41796128435 --dir "$RUNNER_TEMP/mvp017-original"
          printf '%s  %s\n' \
            ebeb64f1fc27328c0ff5f063ede33ec1d08615e482d4a017680ea0d5813b9aa0 \
            "$RUNNER_TEMP/mvp017-original/cohort-index.json" | sha256sum --check -
          MVP017_PRIVATE_ARCHIVE_ORIGINAL_ROOT="$RUNNER_TEMP/mvp017-original" \
            pytest -q tests/test_mvp017_private_original_archive.py
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from hbi.mvp017_private_original_archive import store_original, verify_archive
          base = Path(os.environ["RUNNER_TEMP"]) / "mvp017-original"
          raw = base / "cohort-index.json"
          root = Path(os.environ["RUNNER_TEMP"]) / "mvp017-scratch-private"
          output = store_original(
              archive_root=root, source_file=raw,
              source_provider="RIKSTOTO",
              endpoint="/api/racedays",
              observed_at_utc="2026-11-04T07:59:00+00:00",
              source_run_id=41796128435, source_artifact_id=13304793845,
              approval_id="CI_LOCAL_SCRATCH_ONLY_MVP017",
          )
          verified = verify_archive(root)
          assert verified["original_source_blobs"] == 1
          assert verified["pit_certified"] is False and verified["bet_authority"] is False
          assert output["original_sha256"] == hashlib.sha256(raw.read_bytes()).hexdigest()
          attestation = {
              "schema": "MVP017_LOCAL_REPLAY_EVIDENCE_V1",
              "original_sha256": output["original_sha256"],
              "receipt_sha256": output["receipt_sha256"],
              "local_blob_count": verified["original_source_blobs"],
              "local_receipt_count": verified["distinct_provenance_receipts"],
              "external_retention_deployed": False,
              "bet_authority": False,
              "pit_certified": False,
          }
          (base / "evidence.json").write_text(
              json.dumps(attestation, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload MVP-017 metadata-only archive evidence (no raw bytes)
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/private-ci-source-archive')) && always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp017-local-private-archive-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/mvp017-original/evidence.json
          if-no-files-found: warn
          retention-days: 30

      # Five original physical source reasons; no retrospective model freeze.
      - name: Replay authenticated 21 Nov Collector, SQLite, Shadow and Pre-Watch
        id: replay_nov21
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/private-ci-source-archive'))
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/p0-nov21"
          python - "$RUNNER_TEMP/core003-v2-input" "$root" <<'PYTHON'
          import sys
          from scripts.core003_replay_v2 import extract_inputs

          extract_inputs(sys.argv[1], sys.argv[2])
          PYTHON
          P0_NOV21_COLLECTOR_ROOT="$root/collector" \
          P0_NOV21_SQLITE="$root/state/core003-pilot.sqlite" \
          P0_NOV21_FROZEN_SHADOW="$root/model/race-001/shadow.json" \
          P0_NOV21_SOURCE_REPORT="$root/report/core003-pilot-report.json" \
          P0_PRODUCT_OUTPUT="$root/product" \
            pytest -q -s tests/test_collector_nov21_rebaseline.py
          for file in prewatch-day.json prewatch-day.md prewatch-events.jsonl; do
            test -s "$root/product/$file"
          done

      - name: Upload authenticated Pre-Watch day readback (not live betting)
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/private-ci-source-archive')) && steps.replay_nov21.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: v3313-product-day-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p0-nov21/product/prewatch-day.json
            ${{ runner.temp }}/p0-nov21/product/prewatch-day.md
            ${{ runner.temp }}/p0-nov21/product/prewatch-events.jsonl
          if-no-files-found: error
          retention-days: 30

      - name: Replay DEV-009 outcome scorecard on original frozen Eskilstuna archive
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/private-ci-source-archive'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dev009/models/41646155051"
          python scripts/ci_originals.py extract --run 41646155051 --name bet-mvp-shadow-41646155051 --dir "$RUNNER_TEMP/dev009/models/41646155051"
          printf '%s  %s\n' \
            f04dd8f19254764114739009383371e3367c445c917c8fac5b08cf085e814a6d \
            "$RUNNER_TEMP/dev009/models/41646155051/race-001/shadow.json" \
            | sha256sum --check -
          DEV009_AUTHENTIC_ARCHIVE_ROOT="$RUNNER_TEMP/dev009/models" \
            pytest -q tests/test_prospective_outcome_scorecard.py
          python -m hbi.prospective_outcome_scorecard \
            --models-root "$RUNNER_TEMP/dev009/models" \
            --output-dir "$RUNNER_TEMP/dev009/scorecard" \
            --fetch-official
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                             "dev009/scorecard/index.json").read_text())
          assert data["bet_authority"] is False
          assert data["v33_evaluator_called"] is False
          assert data["counts"]["physical_races"] == 3
          assert data["counts"]["complete_prediction_fields"] == 1
          assert data["counts"]["not_evaluable"] >= 2
          record = next(r for r in data["records"]
                        if r["race_id"] == "RIKSTOTO:S1_NR_2026-11-03:8")
          assert record["source_model_original_sha256"] == (
              "f04dd8f19254764114739009383371e3367c445c917c8fac5b08cf085e814a6d"
          )
          assert record["active_runners"] == 12
          assert record["cohort"] == "PROSPECTIVE_NOT_PIT_CERTIFIED"
          assert record["status"] in ("EVALUABLE_RESEARCH_ONLY", "NOT_EVALUABLE")
          if record["status"] == "EVALUABLE_RESEARCH_ONLY":
              assert len(record["original_result_receipts"]) == 2
              assert all(r["raw_sha256"] for r in record["original_result_receipts"])
          PY

      - name: Upload DEV-009 original archive scorecard (NO BET)
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/private-ci-source-archive')) && always()
        uses: actions/upload-artifact@v4
        with:
          name: dev009-authentic-original-scorecard-${{ github.run_id }}
          path: ${{ runner.temp }}/dev009/scorecard/index.json
          if-no-files-found: warn
          retention-days: 30

      # Five genuine model archives from 2 Nov exist on GitHub, but predate
      # the immutable cohort index. Do not turn them into admitted models.
      - name: Replay MVP-014 original legacy-index classification (NO PIT/BET)
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/private-ci-source-archive'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mvp014-legacy"
          mkdir -p "$root"
          for run in 41456642411 41459303701 41461113601 41462919513 41463276002; do
            mkdir -p "$root/$run"
            python scripts/ci_originals.py extract --run "$run" --name "bet-mvp-shadow-$run" --dir "$root/$run"
          done
          MVP014_LEGACY_ORIGINALS_ROOT="$root" \
            pytest -q tests/test_dev011_coverage.py::test_authentic_nov2_five_legacy_originals_exist_without_cohort_indexes
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from hbi.dev011_coverage import finalize, plan
          root = Path(os.environ["RUNNER_TEMP"]) / "mvp014-legacy"
          runs = (41456642411, 41459303701, 41461113601, 41462919513, 41463276002)
          original_artifact_ids = (
              13147076977, 13147433634, 13149181358, 13150157261, 13150442459,
          )
          artifacts = [{"id": aid, "name": f"bet-mvp-shadow-{run}",
                        "expired": False, "workflow_run": {"id": run, "head_branch": "main"}}
                       for run, aid in zip(runs, original_artifact_ids, strict=True)]
          inventory = plan([{"total_count": 5, "artifacts": artifacts}],
                           current_run_id=99999999, inventory_sha="f" * 64)
          report = finalize(inventory, models_root=root, results_root=root / "results")
          report["evidence_mode"] = "GENUINE_GITHUB_ORIGINAL_BYTES_REAL_ARTIFACT_IDS"
          report["original_model_shas"] = {
              str(run): [hashlib.sha256(f.read_bytes()).hexdigest()
                         for f in sorted((root / str(run)).rglob("shadow.json"))]
              for run in runs
          }
          (root / "legacy-coverage.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload MVP-014 legacy-original coverage diagnosis (NO BET)
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/private-ci-source-archive')) && always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp014-legacy-original-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/mvp014-legacy/legacy-coverage.json
          if-no-files-found: warn
          retention-days: 30

      - name: Replay DEV-011 retained Eskilstuna model and pinned originals (21 empty runs)
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/private-ci-source-archive'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dev011/models/41646155051" \
            "$RUNNER_TEMP/dev011/results/41662283155"
          python scripts/ci_originals.py extract --run 41646155051 --name bet-mvp-shadow-41646155051 --dir "$RUNNER_TEMP/dev011/models/41646155051"
          python scripts/ci_originals.py extract --run 41662283155 --name dev009-authentic-original-scorecard-41662283155 --dir "$RUNNER_TEMP/dev011/results/41662283155"
          printf '%s  %s\n' \
            f04dd8f19254764114739009383371e3367c445c917c8fac5b08cf085e814a6d \
            "$RUNNER_TEMP/dev011/models/41646155051/race-001/shadow.json" \
            | sha256sum --check -
          DEV011_AUTHENTIC_MODEL_ROOT="$RUNNER_TEMP/dev011/models" \
          DEV011_AUTHENTIC_RESULTS_ROOT="$RUNNER_TEMP/dev011/results" \
          DEV011_CI_MANIFEST_DIR="$RUNNER_TEMP/dev011/coverage" \
            pytest -q tests/test_dev011_coverage.py
          python -m hbi.prospective_outcome_scorecard \
            --models-root "$RUNNER_TEMP/dev011/models" \
            --prior-results-root "$RUNNER_TEMP/dev011/results" \
            --coverage-manifest "$RUNNER_TEMP/dev011/coverage/manifest.json" \
            --output-dir "$RUNNER_TEMP/dev011/scorecard"
          python - <<'PY'
