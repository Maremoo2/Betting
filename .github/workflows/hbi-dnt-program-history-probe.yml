name: HBI DNT Program History Research Probe

on:
  pull_request:
    paths:
      - "src/hbi/program_history_probe.py"
      - "tests/test_program_history_probe.py"
      - ".github/workflows/hbi-dnt-program-history-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hbi-dnt-program-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research-only:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: pip install -e ".[dev]"
      - name: Local bounded-source tests
        run: pytest -q tests/test_program_history_probe.py
      - name: Run read-only DNT program evidence probe
        env:
          HBI_PROGRAM_PROBE_DIR: history-program-probe
        run: python -m hbi.program_history_probe
      - name: Preserve source hashes and raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hbi-dnt-program-evidence-${{ github.run_id }}
          path: history-program-probe/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
