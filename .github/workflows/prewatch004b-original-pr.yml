name: PREWATCH-004B historic features real original E2E (NO BET)

on:
  pull_request:
    paths:
      - "src/hbi/prewatch004b_features.py"
      - "tests/test_prewatch004b_features.py"
      - "docs/PREWATCH004B_VERIFIED_FEATURES.md"
      - "docs/PREWATCH004B_FEATURE_CONTEXT_SCHEMA.json"
      - ".github/workflows/prewatch004b-original-pr.yml"

permissions:
  contents: read
  actions: read

jobs:
  original-nov23:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HBI
        run: pip install -e ".[dev]"
      - name: Run PREWATCH-004B tests
        run: pytest -q tests/test_prewatch004b_features.py
      - name: Download authentic Collector 23 Nov 2026 original archive
        env:
          GH_TOKEN: \${{ secrets.CLOUD_RUN_COLLECTOR_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          mkdir -p collector-input
          gh run download 45141884691 \
            --repo Maremoo2/rikstoto-program-collector \
            --name prewatch-bridge-fallback --dir collector-input
      - name: Rebuild full source inventory and verified-feature audit twice
        run: |
          set -euo pipefail
          mapfile -t originals < <(find collector-input -type f -name 'rikstoto-2026-11-23-*.zip')
          test "\${#originals[@]}" -eq 1
          archive="\${originals[0]}"
          test -s "$archive"
          test -s "$archive.sha256"
          python -m hbi.prewatch004b_features \
            --archive "$archive" --checksum "$archive.sha256" \
            --date-oslo 2026-11-23 --output prewatch004b-output
          python -m hbi.prewatch004b_features \
            --archive "$archive" --checksum "$archive.sha256" \
            --date-oslo 2026-11-23 --output prewatch004b-output
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          output = Path("prewatch004b-output")
          report = json.loads((output/"features_coverage.json").read_text())
          assert report["physical_race_count_source_discovered"] == 26, report
          assert report["listed_runner_coverage"]["total"] == 284, report
          assert report["active_runner_coverage"]["total"] <= 284
          assert len(report["files"]) == 26
          assert len({x["filename"] for x in report["files"]}) == 26
          for entry in report["files"]:
              raw=(output/entry["filename"]).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==entry["sha256"]
              pack=json.loads(raw)
              assert pack["listed_count"]==len(pack["runners"])
              assert pack["active_count"]==sum(not r["scratched"] for r in pack["runners"])
              assert pack["phase_a_status"]=="NOT_RUN"
              assert pack["pit_certified"] is False
              assert pack["bet_authorized"] is False
              for r in pack["runners"]:
                  assert r["pit_eligible"] is False
                  assert r["model_eligible"] is False
                  assert r["historical_results_with_original_PIT_and_identity"] == 0
                  assert r["verified_racing_features"]["verified_win_rate"]["value"] == "UNKNOWN"
          for scope in ("listed_runner_coverage", "active_runner_coverage"):
              counters = report[scope]
              assert counters["independently_verified_historic_results"] == 0
              assert counters["permanent_cross_provider_horse_id"] == 0
              assert counters["complete_pit_history_attested"] == 0
          example=next(
              (json.loads((output/entry["filename"]).read_text())
               for entry in report["files"]
               if "S1_NR_2026-11-23_1.json" in entry["filename"]), None
          )
          if example is None:
              example=json.loads((output/report["files"][0]["filename"]).read_text())
          print("PREWATCH004B_ACTUAL_COVERAGE " + json.dumps(
              {k:report[k] for k in (
                  "physical_race_count_source_discovered", "listed_runner_coverage",
                  "active_runner_coverage", "history_raw_rows_total",
                  "history_semantic_rows_total", "blockers",
                  "independent_whole_day_denominator_verified",
              )}, ensure_ascii=False, sort_keys=True))
          print("PREWATCH004B_AUTHENTIC_EXAMPLE " + json.dumps({
              "race_id": example["race_id"], "active_count": example["active_count"],
              "horses": [
                  {"number":r["selection_id"], "name":r["horse_name"],
                   "raw_prior_lines":r["source_history_count"],
                   "semantic_rows":r["verified_racing_features"]["semantic_extracted_prior_rows"]["value"],
                   "verified_wins":r["verified_racing_features"]["verified_wins"]["value"]}
                  for r in example["runners"][:3]
              ], "phase_a":example["phase_a_status"]}, ensure_ascii=False, sort_keys=True))
          PY
      - name: Publish research-only whole-day feature audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prewatch004b-real-original-20261123-\${{ github.run_id }}
          path: prewatch004b-output/
          if-no-files-found: warn
          retention-days: 14
