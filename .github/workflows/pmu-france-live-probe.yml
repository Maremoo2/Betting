name: HBI PMU France Live Probe

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/pmu-france-full-field-v1"

permissions:
  contents: read

concurrency:
  group: hbi-pmu-france-live-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install HBI
        run: pip install -e ".[dev]"

      - name: Probe current French PMU pre-race schema
        env:
          HBI_PMU_PROBE_PATH: pmu-live-probe.json
        run: python -m hbi.pmu_live_probe

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hbi-pmu-france-live-probe-${{ github.run_id }}
          path: pmu-live-probe.json
          if-no-files-found: ignore
          retention-days: 14
