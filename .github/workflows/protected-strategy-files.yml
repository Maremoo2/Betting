name: HBI Protected Strategy Files

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  protected-strategy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect protected changes
        id: protected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed.txt
          cat /tmp/changed.txt

          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path

          protected = {
              "src/hbi/fundamental.py",
              "src/hbi/probability.py",
              "src/hbi/engine.py",
              "src/hbi/decision.py",
              "src/hbi/shadow.py",
              "src/hbi/race_difficulty.py",
              "src/hbi/governance.py",
              "src/hbi/promotion.py",
              "docs/research_governance.json",
          }
          changed = {
              line.strip()
              for line in Path("/tmp/changed.txt").read_text().splitlines()
              if line.strip()
          }
          hits = sorted(changed & protected)
          print(f"protected_changed={'true' if hits else 'false'}")
          print("protected_files=" + ",".join(hits))
          PY

      - name: Require explicit strategy approval
        if: steps.protected.outputs.protected_changed == 'true'
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PROTECTED_FILES: ${{ steps.protected.outputs.protected_files }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          labels = set(json.loads(os.environ.get("LABELS_JSON", "[]")))
          required = "strategy-change-approved"
          protected = os.environ.get("PROTECTED_FILES", "")
          print(f"Protected HBI files changed: {protected}")
          if required not in labels:
              print(
                  "BLOCKED: add the 'strategy-change-approved' PR label only after "
                  "explicitly reviewing the model/governance change."
              )
              sys.exit(1)
          print("Explicit strategy-change approval label present.")
          PY

      - name: Confirm no protected strategy change
        if: steps.protected.outputs.protected_changed != 'true'
        run: echo "No protected HBI strategy/governance files changed."
