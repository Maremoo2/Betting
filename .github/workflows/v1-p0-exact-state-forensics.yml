name: V1 P0 Exact-State Forensics (Read Only, No Admission)

on:
  pull_request:
    paths:
      - 'src/hbi/v1_p0_triage.py'
      - 'tests/test_v1_p0_triage.py'
      - '.github/workflows/v1-p0-exact-state-forensics.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  v1-p0-evidence:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline read-only research and tests
        run: python -m pip install -e '.[dev]'
      - name: Pure synthetic negative tests do not write active data
        run: python -m pytest -q tests/test_v1_p0_triage.py tests/test_legacy_provenance.py
      - name: Restore PINNED genuine 2026-10-31 main-branch completed state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HBI_DB_PATH: ${{ runner.temp }}/original-frozen-hbi.sqlite
        run: |
          set -euo pipefail
          run=41253056731
          artifact=13062605605
          expected_sha=900e0896a9dc4b67e6644bc03151f1352d4c695a
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run"             --jq '.head_branch + " " + .conclusion + " " + .head_sha'             > "$RUNNER_TEMP/original-run-metadata.txt"
          grep -qx "main success $expected_sha" "$RUNNER_TEMP/original-run-metadata.txt"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact"             --jq '.name + " " + (.expired|tostring) + " " + (.workflow_run.id|tostring)'             > "$RUNNER_TEMP/source-artifact-metadata.txt"
          grep -qx "hbi-state false $run" "$RUNNER_TEMP/source-artifact-metadata.txt"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip"             > "$RUNNER_TEMP/original-frozen-hbi-artifact.zip"
          unzip -Z1 "$RUNNER_TEMP/original-frozen-hbi-artifact.zip"             | grep -qx 'data/hbi.sqlite'
          unzip -p "$RUNNER_TEMP/original-frozen-hbi-artifact.zip"             'data/hbi.sqlite' > "$HBI_DB_PATH"
          test -s "$HBI_DB_PATH"
          {
            echo 'STATE_RESTORE=PINNED_ORIGINAL_MAIN_COMPLETED'
            echo "source_run_id=$run"
            echo "source_artifact_id=$artifact"
            echo "source_head_sha=$expected_sha"
            sha256sum "$RUNNER_TEMP/original-frozen-hbi-artifact.zip"
            sha256sum "$HBI_DB_PATH"
          } > "$RUNNER_TEMP/source-state.txt"
      - name: Read-only diagnose original frozen replay and overdue paper tickets
        shell: bash
        run: |
          set -euo pipefail
          python -m hbi.v1_p0_triage \
            --db "$RUNNER_TEMP/original-frozen-hbi.sqlite" \
            --output "$RUNNER_TEMP/v1-p0-readonly-triage.json" \
            > "$RUNNER_TEMP/diagnostic-summary.json"
      - name: Assert V1 fail-gates remain fail-closed with no source write
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = json.loads((Path(os.environ['RUNNER_TEMP']) / 'v1-p0-readonly-triage.json').read_text())
          assert p['schema'] == 'HBI_V1_P0_READ_ONLY_TRIAGE_V1'
          assert p['status'] == 'DIAGNOSTIC_ONLY_P0_NOT_CLEARED'
          assert len(p['source_database_sha256']) == 64
          assert p['source_database_unchanged'] is True
          assert p['snapshot_rewritten'] is False
          assert p['v1_system_audit_failure_overridden'] is False
          assert p['prospective_pit_validated'] is False
          assert p['model_or_bet_authority'] is False
          assert p['replay']['original_v1_audit_overridden'] is False
          assert p['replay_coverage']['total_decisions_examined'] == p['replay']['total_decisions']
          assert p['replay_coverage']['eligible_with_original_saved_provenance'] == p['replay']['provenance_eligible_checked']
          assert p['replay_coverage']['incomplete_replay_evidence'] == p['replay']['incomplete_provenance_skipped']
          assert p['replay_coverage']['missing_historical_evidence_inferred_as_pass'] is False
          assert p['replay_coverage']['shadow_executable_status_granted'] is False
          assert p['settlement']['stored_outcome_is_payout_evidence'] is False
          assert p['settlement']['money_movement_performed'] is False
          assert all(x['settlement_or_refund_authorized'] is False
                     for x in p['settlement']['tickets'])
          print('V1_P0_ORIGINAL_SOURCE_DIAGNOSED_NOT_CLEARED_NO_MONEY_MOVED')
          print('Legacy source reconstructed:', p['replay']['legacy_late_attachment_original_source_reconstructed'])
          print('Legacy unreconciled:', p['replay']['historical_replay_unreconciled'])
          print('Overdue unsettled tickets:', p['settlement']['overdue_unsettled_with_stored_outcome'])
          print('Unreplayable eligible decision statuses:', p['replay_coverage']['incomplete_evidence_for_priced_or_watched_decision'])
          print('Skipped evidence groups:', p['replay_coverage']['reason_by_frozen_status'])
          PY
      - name: Probe ORIGINAL official results/starts for the one pinned unsettled paper ticket (GET only)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          triage = json.loads((root / "v1-p0-readonly-triage.json").read_text())
          tickets = triage["settlement"]["tickets"]
          # Pinned original HBI state, not a new or inferred selection.
          assert len(tickets) == 1, "Pinned original backlog denominator changed"
          ticket = tickets[0]
          assert (ticket["provider_raceday_key"], ticket["race_number"],
                  ticket["selected_runner"], ticket["winner_from_stored_outcome"]) == (
                      "S4_NR_2026-10-14", 6, "8", "5"
                  ), "Original old source ticket identity changed"
          subprocess.run([
              sys.executable, "scripts/p0_official_settlement_probe.py",
              "--raceday-key", ticket["provider_raceday_key"],
              "--race-number", str(ticket["race_number"]),
              "--selection", ticket["selected_runner"],
              "--cached-winner", ticket["winner_from_stored_outcome"],
              "--probe-start-status", "--execute-public-get",
              "--output", str(root / "v1-p0-original-official-result-GET-only.json"),
          ], check=True)
          p = json.loads(
              (root / "v1-p0-original-official-result-GET-only.json").read_text()
          )
          assert p["bookkeeping_authority"] is False
          assert p["real_money_authority"] is False
          assert p["p0_status"] == "BLOCKED_PENDING_INDEPENDENT_ADJUDICATION"
          assert p["scope"] == "ONE_PAPER_RACE_SOURCE_EVIDENCE_NO_SETTLEMENT"
          print("OFFICIAL_SOURCE_PROBE_REVIEW_ONLY_NO_SETTLEMENT")
          print("Structural evidence reasons:", p["structural_reasons"])
          print("Publisher payload observed:", p["both_official_http_payloads_observed"])
          PY
      - name: Upload forensic report only, not original SQLite or raw provider payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-p0-original-state-forensics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/v1-p0-readonly-triage.json
            ${{ runner.temp }}/source-state.txt
            ${{ runner.temp }}/v1-p0-original-official-result-GET-only.json
          if-no-files-found: warn
          retention-days: 30
