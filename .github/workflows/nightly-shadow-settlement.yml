name: HBI Nightly Shadow Settlement

on:
  schedule:
    # One of these is 00:30 Europe/Oslo depending on CET/CEST. Local gate decides.
    - cron: "30 22,23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hbi-state-writer
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install HBI
        run: pip install -e ".[dev]"

      - name: Oslo nightly gate
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import UTC, datetime
          from zoneinfo import ZoneInfo
          local = datetime.now(UTC).astimezone(ZoneInfo("Europe/Oslo"))
          print(f"should_run={'true' if local.hour == 0 else 'false'}")
          print(f"local_time={local.isoformat()}")
          PY
          fi

      - name: Restore latest HBI state
        if: steps.gate.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HBI_DB_PATH: data/hbi.sqlite
        run: python -m hbi.state_artifact

      - name: Optional scheduled-intelligence evidence import
        if: steps.gate.outputs.should_run == 'true'
        env:
          HBI_SPREADSHEET_ID: ${{ secrets.HBI_SPREADSHEET_ID }}
          HBI_GOOGLE_CREDENTIALS_JSON: ${{ secrets.HBI_GOOGLE_CREDENTIALS_JSON }}
        shell: bash
        run: |
          if [[ -z "$HBI_SPREADSHEET_ID" || -z "$HBI_GOOGLE_CREDENTIALS_JSON" ]]; then
            echo "Sheets secrets not configured; skipping intelligence inbox import."
            exit 0
          fi
          pip install -e ".[sheets]"
          CREDS="$RUNNER_TEMP/hbi-google-service-account.json"
          printf '%s' "$HBI_GOOGLE_CREDENTIALS_JSON" > "$CREDS"
          hbi --db data/hbi.sqlite ingest-evidence-inbox \
            --spreadsheet-id "$HBI_SPREADSHEET_ID" \
            --credentials "$CREDS" \
            --worksheet "HBI_EVIDENCE_INBOX"

      - name: Settle shadow tickets and run Research Observatory
        if: steps.gate.outputs.should_run == 'true'
        env:
          HBI_DB_PATH: data/hbi.sqlite
          HBI_NIGHTLY_REPORT_PATH: nightly-report.json
          HBI_OBSERVATORY_JSON_PATH: research-observatory.json
          HBI_OBSERVATORY_MD_PATH: research-observatory.md
          HBI_V1_AUDIT_DIR: research-v1
        run: python -m hbi.nightly_job

      - name: Export canonical database as CSV
        if: steps.gate.outputs.should_run == 'true'
        run: hbi --db data/hbi.sqlite export hbi-export --format csv

      - name: Export canonical database as JSON
        if: steps.gate.outputs.should_run == 'true'
        run: |
          mkdir -p hbi-backup
          hbi --db data/hbi.sqlite export hbi-backup/hbi-export.json --format json

      - name: Build immutable backup manifest
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m hbi.backup \
            --db data/hbi.sqlite \
            --output backup-manifest.json \
            --include hbi-export hbi-backup/hbi-export.json \
              nightly-report.json research-observatory.json research-observatory.md \
              research-v1

      - name: Optional Google Sheets mirror
        if: steps.gate.outputs.should_run == 'true'
        env:
          HBI_SPREADSHEET_ID: ${{ secrets.HBI_SPREADSHEET_ID }}
          HBI_GOOGLE_CREDENTIALS_JSON: ${{ secrets.HBI_GOOGLE_CREDENTIALS_JSON }}
        shell: bash
        run: |
          if [[ -z "$HBI_SPREADSHEET_ID" || -z "$HBI_GOOGLE_CREDENTIALS_JSON" ]]; then
            echo "Sheets secrets not configured; skipping mirror."
            exit 0
          fi
          pip install -e ".[sheets]"
          CREDS="$RUNNER_TEMP/hbi-google-service-account.json"
          printf '%s' "$HBI_GOOGLE_CREDENTIALS_JSON" > "$CREDS"
          hbi --db data/hbi.sqlite sync-sheets \
            --spreadsheet-id "$HBI_SPREADSHEET_ID" \
            --credentials "$CREDS"

      - name: Upload immutable research backup
        if: steps.gate.outputs.should_run == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: hbi-research-backup-${{ github.run_id }}
          path: |
            data/hbi.sqlite
            hbi-export/
            hbi-backup/hbi-export.json
            nightly-report.json
            research-observatory.json
            research-observatory.md
            research-v1/
            backup-manifest.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Persist rolling HBI state
        if: steps.gate.outputs.should_run == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: hbi-state
          path: |
            data/hbi.sqlite
            nightly-report.json
            research-observatory.json
            research-observatory.md
            research-v1/
            backup-manifest.json
            hbi-export/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Upload settlement diagnostics on failure
        if: steps.gate.outputs.should_run == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: hbi-nightly-failure-${{ github.run_id }}
          path: |
            nightly-report.json
            research-observatory.json
            research-observatory.md
            research-v1/
            backup-manifest.json
          if-no-files-found: ignore
          retention-days: 14
