name: HBI V1 System Audit

on:
  schedule:
    # One of these is 01:15 Europe/Oslo depending on CET/CEST; local gate filters.
    - cron: "15 23,0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/hbi/**"
      - "db/**"
      - "docs/research_governance.json"
      - "docs/RESEARCH_GOVERNANCE.md"
      - "docs/V1_ACCEPTANCE_CRITERIA.md"
      - ".github/workflows/v1-system-audit.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: hbi-v1-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install HBI
        run: pip install -e ".[dev]"

      - name: Determine audit mode
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import UTC, datetime
          from zoneinfo import ZoneInfo
          local = datetime.now(UTC).astimezone(ZoneInfo("Europe/Oslo"))
          print(f"should_run={'true' if local.hour == 1 else 'false'}")
          print(f"local_time={local.isoformat()}")
          PY
          fi

      - name: Restore latest HBI state
        if: steps.gate.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HBI_DB_PATH: data/hbi.sqlite
          HBI_RESTORE_RECEIPT_PATH: v1-state-restore-receipt.json
        run: python -m hbi.state_artifact

      - name: Verify exact selected original artifact and restored SQLite SHA
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          path = Path("v1-state-restore-receipt.json")
          receipt = json.loads(path.read_text(encoding="utf-8"))
          assert receipt["schema"] == "HBI_STATE_RESTORE_RECEIPT_V1"
          assert receipt["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert receipt["audit_workflow_run_id"] == int(os.environ["GITHUB_RUN_ID"])
          assert receipt["audit_code_sha"] == os.environ["GITHUB_SHA"]
          restored = datetime.fromisoformat(receipt["restored_at_utc"])
          assert restored.tzinfo is not None
          assert restored <= datetime.now(UTC)
          assert (datetime.now(UTC) - restored).total_seconds() < 1800
          assert receipt["artifact_name"] == "hbi-state"
          assert receipt["source_head_branch"] == os.environ["GITHUB_REF_NAME"]
          assert type(receipt["artifact_id"]) is int
          assert type(receipt["source_workflow_run_id"]) is int
          assert len(receipt["artifact_zip_sha256"]) == 64
          assert receipt["bet_authority"] is False
          assert receipt["historical_decisions_modified"] is False
          sha = hashlib.sha256()
          size = 0
          with Path("data/hbi.sqlite").open("rb") as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b""):
                  sha.update(block)
                  size += len(block)
          assert sha.hexdigest() == receipt["restored_database_sha256"]
          assert size == receipt["restored_database_size_bytes"]
          print(
              "V1_RESTORED_ARTIFACT_PIN=ID:",
              receipt["artifact_id"],
              "SOURCE_RUN:", receipt["source_workflow_run_id"],
              "AUDIT_RUN:", receipt["audit_workflow_run_id"],
              "AUDIT_SHA:", receipt["audit_code_sha"],
              "RESTORED_AT:", receipt["restored_at_utc"],
              "DB_SHA256:", sha.hexdigest(),
          )
          PY

      - name: Validate V1 engineering contract
        if: steps.gate.outputs.should_run == 'true'
        run: python -m hbi.v1_readiness | tee v1-readiness.json

      - name: Run V1 system audit against restored state
        if: steps.gate.outputs.should_run == 'true'
        run: python -m hbi.v1_audit --db data/hbi.sqlite --output-dir research-v1

      - name: Report October operational coverage even when integrity fails
        if: steps.gate.outputs.should_run == 'true' && always()
        run: >-
          python -m hbi.operations_report --db data/hbi.sqlite
          --start 2026-10-01 --end 2026-10-07
          --output research-v1/october-operations.json

      - name: Build evidence-driven October tracker
        if: steps.gate.outputs.should_run == 'true' && always()
        run: python -m hbi.october_tracker --db data/hbi.sqlite --output-dir research-v1

      - name: Upload V1 audit evidence
        if: steps.gate.outputs.should_run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: hbi-v1-system-audit-${{ github.run_id }}
          path: |
            v1-readiness.json
            v1-state-restore-receipt.json
            research-v1/
          if-no-files-found: error
          retention-days: 90
