[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "horse-betting-intelligence"
version = "0.2.0"
description = "Benter-first horse betting research and decision-support foundation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
sheets = ["gspread>=6.1", "google-auth>=2.35"]

[project.scripts]
hbi = "hbi.cli:main"
betting = "betting.cli:main"
rikstoto-pre-winner = "rikstoto_crawler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hbi", "src/betting", "src/rikstoto_crawler"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
