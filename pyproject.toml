[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "horse-betting-intelligence"
version = "0.1.0"
description = "Benter-first horse betting research and decision-support foundation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/hbi"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
